<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Heroes of Oakrest</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12140f;
        --surface: #1e211a;
        --surface-alt: #2a2d23;
        --text: #ede6cf;
        --dim: #b3a98e;
        --border: #454837;
        --accent: #a8bf85;
        --accent-deep: #d6e2b8;
        --teal: #8ac2bf;
        --gold: #e0b354;
        --danger: #e09a88;
        --shadow: rgba(0, 0, 0, 0.55);
        --radius: 6px;
        --font-display: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { overflow-x: clip; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        line-height: 1.5;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      input[type="range"] { min-height: 2rem; }
      .font-display { font-family: var(--font-display); }
      .wrap { margin: 0 auto; max-width: 56rem; padding: 0 1rem; }
      main { padding-bottom: 4rem; }

      /* Header */
      header.site {
        position: sticky; top: 0; z-index: 30;
        border-bottom: 2px solid var(--gold);
        background: color-mix(in srgb, var(--bg) 97%, transparent);
        backdrop-filter: blur(6px);
        padding-top: env(safe-area-inset-top, 0px);
      }
      .kicker { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--teal); margin: 0.75rem 0 0; }
      .site-title { font-family: var(--font-display); text-align: center; font-size: 1.25rem; font-weight: 700; margin: 0.15rem 0 0; }
      nav.sections { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem; padding: 0.5rem 0.75rem; }
      nav.sections button {
        border: 0; background: none; cursor: pointer; font: inherit;
        white-space: nowrap; border-radius: 999px; padding: 0.375rem 0.875rem;
        font-size: 0.875rem; font-weight: 500; color: var(--dim);
      }
      nav.sections button[aria-current="page"] { background: var(--accent-deep); color: var(--bg); }

      /* Generic bits */
      h2.view-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--accent-deep); margin: 0; }
      .muted { color: var(--dim); }
      .small { font-size: 0.875rem; }
      .prose-body { overflow-wrap: break-word; }
      .prose-body p { margin: 0 0 1rem; font-size: 16px; line-height: 1.75; }
      .prose-body p:last-child { margin-bottom: 0; }
      .prose-body p.prose-lead { font-size: 1.125rem; line-height: 1.7; }
      .prose-body p.prose-lead::first-letter {
        font-family: var(--font-display); font-size: 3.1em; font-weight: 700; line-height: 0.82;
        float: left; padding: 0.06em 0.14em 0 0; color: var(--gold);
      }
      .prose-h {
        font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--accent-deep);
        margin: 1.75rem 0 0.625rem; padding-bottom: 0.375rem; border-bottom: 1px solid var(--border);
        scroll-margin-top: 8rem;
      }
      .prose-h:first-child { margin-top: 0.25rem; }
      .prose-list { margin: 0 0 1rem; padding-left: 1.375rem; font-size: 16px; line-height: 1.7; }
      .prose-list li { margin: 0 0 0.375rem; }
      .prose-list li::marker { color: var(--gold); }
      .prose-quote {
        margin: 1.25rem 0; padding: 0.25rem 0 0.25rem 1rem; border-left: 3px solid var(--gold);
        font-size: 1.0625rem; line-height: 1.65; font-style: italic; color: var(--accent-deep);
      }
      .prose-break { display: flex; align-items: center; justify-content: center; margin: 1.5rem 0; }
      .prose-break::before, .prose-break::after { content: ""; height: 1px; width: 4.5rem; background: var(--border); }
      .prose-break span { width: 0.55rem; height: 0.55rem; margin: 0 0.75rem; transform: rotate(45deg); border: 2px solid var(--gold); opacity: 0.7; }
      /* No-art placeholder tag on cards, and the in-page art suggestion panel */
      .no-art-tag { position: absolute; bottom: 0.55rem; left: 50%; transform: translateX(-50%); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
      .art-suggest { margin: 1rem 0 1.25rem; border: 1.5px dashed var(--gold); border-radius: var(--radius); background: var(--surface); padding: 1rem; }
      .art-suggest-kicker { margin: 0; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
      .art-suggest h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--accent-deep); margin: 0.2rem 0 0; }
      .art-suggest .art-done { border: 1px solid var(--teal); border-radius: var(--radius); padding: 0.75rem; }
      button.wiki-link {
        display: inline; border: 0; background: none; padding: 0; margin: 0; cursor: pointer;
        font: inherit; color: var(--teal); text-decoration: underline; text-decoration-style: dotted;
        text-underline-offset: 3px; min-height: 0; text-align: left;
      }
      button.wiki-link:hover, button.wiki-link:focus-visible { color: var(--accent-deep); text-decoration-style: solid; }
      button.wiki-link.is-person { color: var(--accent-deep); }
      button.wiki-link.is-person:hover, button.wiki-link.is-person:focus-visible { color: var(--gold); }
      button.wiki-link.is-hist, button.wiki-link.is-chron { color: var(--gold); }
      button.wiki-link.is-hist:hover, button.wiki-link.is-hist:focus-visible,
      button.wiki-link.is-chron:hover, button.wiki-link.is-chron:focus-visible { color: var(--accent-deep); }
      .article-meta {
        display: flex; flex-wrap: wrap; gap: 0.375rem 1rem; margin-top: 0.625rem;
        font-size: 0.8125rem; color: var(--dim);
      }
      .article-meta strong { color: var(--text); font-weight: 600; }
      .article-toc {
        margin: 1rem 0 1.25rem; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 0.875rem 1rem;
      }
      .article-toc p { margin: 0; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
      .article-toc ul { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.25rem; }
      .article-toc a { color: var(--teal); font-size: 0.9375rem; text-decoration: none; }
      .article-toc a:hover, .article-toc a:focus-visible { text-decoration: underline; }
      .related-box { margin-top: 2rem; border-top: 2px solid var(--gold); padding-top: 1rem; }
      .related-box > h2 { font-family: var(--font-display); font-size: 1.375rem; font-weight: 600; color: var(--accent-deep); margin: 0; }
      .related-group { margin-top: 1rem; }
      .related-group > h3 { margin: 0 0 0.5rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
      .rel-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      button.rel-chip {
        display: inline-flex; align-items: baseline; gap: 0.45rem; border: 1px solid var(--border);
        background: var(--surface); color: var(--text); border-radius: 999px; padding: 0.4rem 0.8rem;
        font: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; text-align: left;
      }
      button.rel-chip:hover, button.rel-chip:focus-visible { border-color: var(--gold); }
      button.rel-chip .rel-kind { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); white-space: nowrap; }
      button.rel-chip .rel-kind.person { color: var(--accent-deep); }
      button.rel-chip .rel-kind.event { color: var(--gold); }
      button.rel-chip .rel-kind.place { color: var(--teal); }
      .wiki-cat-head {
        font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--accent-deep);
        margin: 1.75rem 0 0; padding-bottom: 0.375rem; border-bottom: 2px solid var(--gold);
      }
      .wiki-cat-head .count { font-family: Georgia, serif; font-size: 0.875rem; font-weight: 400; color: var(--dim); }
      ol.tl-list li.tl-item.tl-focus .tl-card { outline: 1px solid var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
        border-radius: 999px; padding: 0.375rem 0.75rem; font-size: 0.875rem; font-weight: 500;
        cursor: pointer; font: inherit;
      }
      .chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
      .chiprow { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .search-input {
        width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); color: var(--text); padding: 0.625rem 0.75rem; font: inherit;
      }
      .card {
        display: flex; flex-direction: column; align-items: stretch;
        width: 100%; height: 100%; min-width: 0; text-align: left; cursor: pointer; font: inherit; color: inherit;
        overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0;
      }
      .card img.thumb { flex: 0 0 auto; display: block; height: auto; aspect-ratio: 4 / 3; width: 100%; object-fit: cover; }
      .card img.thumb-tall { height: 8rem; object-position: top; }
      .card img.thumb-portrait { height: auto; aspect-ratio: 3 / 4; object-position: top; }
      .card .thumb-placeholder { flex: 0 0 auto; position: relative; display: flex; align-items: center; justify-content: center; height: auto; aspect-ratio: 4 / 3; width: 100%; background: var(--surface-alt); border-bottom: 1px solid var(--border); }
      .card .thumb-placeholder.tall { height: 8rem; }
      .card .thumb-placeholder.portrait { height: auto; aspect-ratio: 3 / 4; }
      .card .thumb-placeholder::before { content: ""; position: absolute; left: 50%; top: 50%; width: 4.5rem; height: 1px; background: var(--gold); opacity: 0.35; transform: translate(-50%, -50%); }
      .card .thumb-placeholder::after { content: ""; position: relative; width: 0.6rem; height: 0.6rem; transform: rotate(45deg); border: 2px solid var(--gold); background: var(--surface); opacity: 0.6; }
      .card .pad { display: flex; flex-direction: column; align-items: stretch; flex: 1 1 auto; width: 100%; min-width: 0; padding: 1rem; text-align: left; }
      .card .cat { flex: 0 0 auto; display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); line-height: 1.45; min-height: 1rem; margin-bottom: 0.375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card .name { flex: 0 0 auto; display: block; font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
      .card[data-lore] .name { min-height: 2.925rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card[data-person] .name { min-height: 1.4625rem; }
      .card .role { flex: 0 0 auto; display: block; margin-top: 0.25rem; font-size: 0.875rem; font-weight: 500; line-height: 1.4; min-height: 1.225rem; color: var(--gold); overflow-wrap: break-word; }
      .card .excerpt { display: block; margin-top: 0.375rem; font-size: 0.875rem; line-height: 1.5; color: var(--dim); overflow-wrap: break-word; }
      .card .excerpt.clamp2, .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card .excerpt.clamp2 { min-height: 2.625rem; }
      .card .card-foot { display: block; margin-top: auto; padding-top: 0.625rem; }
      .card .card-foot .status-pill { margin-top: 0; }
      .grid2 { display: grid; gap: 0.75rem; align-items: stretch; }
      .grid2 > * { min-width: 0; height: 100%; }
      @media (min-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
      .status-pill { display: inline-block; margin-top: 0.25rem; border-radius: 999px; background: var(--surface-alt); padding: 0.125rem 0.5rem; font-size: 0.75rem; line-height: 1.4; color: var(--dim); }
      .backlink { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; font-size: 0.875rem; font-weight: 500; color: var(--teal); text-decoration: underline; min-height: 2.25rem; }
      .reader-cat { margin-top: 1rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
      .reader-title { font-family: var(--font-display); font-size: 1.875rem; font-weight: 700; margin: 0.25rem 0 0; line-height: 1.2; }
      .reader-img { margin: 0 0 1rem; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); display: block; }
      .reader-img.portrait { width: min(20rem, 100%); height: auto; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; margin-top: 1rem; }
      hr.rule { margin: 1rem 0; border: 0; border-top: 1px solid var(--border); }
      footer.site { margin-top: 3.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-size: 0.75rem; color: var(--dim); }

      /* Hero */
      .hero { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); }
      .hero img { display: block; height: 11rem; width: 100%; object-fit: cover; }
      @media (min-width: 640px) { .hero img { height: 14rem; } }
      .hero .shade { position: absolute; inset-inline: 0; bottom: 0; padding: 3.5rem 1rem 1rem; background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0.35) 55%, transparent); }
      .hero h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: #fff8e7; margin: 0; }
      .hero p { margin: 0.25rem 0 0; max-width: 36rem; font-size: 0.875rem; color: rgba(255, 243, 214, 0.92); }

      /* Chronicle */
      ol.timeline { list-style: none; margin: 1.25rem 0 0; padding: 0; }
      ol.timeline li { position: relative; border-left: 2px solid var(--border); padding: 0 0 2rem 1.25rem; }
      ol.timeline li:last-child { padding-bottom: 0.5rem; }
      ol.timeline .dot { position: absolute; left: -7px; top: 6px; height: 12px; width: 12px; border-radius: 50%; border: 2px solid var(--bg); background: var(--gold); }
      ol.timeline .date { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); margin: 0; }
      ol.timeline h3 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; margin: 0.125rem 0 0.375rem; }
      ol.timeline li.chron-focus { background: var(--surface); outline: 1px solid var(--gold); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--gold); padding-right: 0.75rem; }

      /* Timeline page: chronological spine, oldest first */
      .tl-era { display: flex; justify-content: center; margin-top: 1.25rem; }
      .tl-era span { border: 1px solid var(--gold); border-radius: 999px; background: var(--surface); color: var(--accent-deep); padding: 0.25rem 0.875rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      ol.tl-list { position: relative; list-style: none; margin: 1.5rem 0 0; padding: 0; }
      ol.tl-list::before { content: ""; position: absolute; left: 11px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
      ol.tl-list li.tl-item { position: relative; padding: 0 0 1.25rem 2.25rem; }
      ol.tl-list li.tl-item:last-child { padding-bottom: 0.25rem; }
      .tl-dot { position: absolute; left: 5px; top: 1.125rem; width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid var(--gold); background: var(--bg); z-index: 1; }
      .tl-item.gm .tl-dot { border-color: var(--danger); }
      .tl-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0.875rem 1rem; }
      .tl-item.gm .tl-card { border-left: 4px solid var(--danger); }
      .tl-date { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); margin: 0; }
      .tl-card h3 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; line-height: 1.3; margin: 0.25rem 0 0; overflow-wrap: break-word; }
      .tl-excerpt { margin: 0.375rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--dim); overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .tl-desc { margin: 0.375rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--dim); overflow-wrap: break-word; }
      .tl-item.history .tl-dot { background: var(--gold); }
      .tl-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
      .tl-link { border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); border-radius: 999px; padding: 0.375rem 0.75rem; font-size: 0.8125rem; font-weight: 500; cursor: pointer; font: inherit; }
      .tl-link.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
      @media (min-width: 720px) {
        ol.tl-list::before { left: 50%; margin-left: -1px; }
        ol.tl-list li.tl-item { width: 50%; padding: 0 2.25rem 1.5rem 0; }
        ol.tl-list li.tl-item.alt { margin-left: 50%; padding: 0 0 1.5rem 2.25rem; }
        ol.tl-list li.tl-item .tl-dot { left: auto; right: -7px; }
        ol.tl-list li.tl-item.alt .tl-dot { left: -7px; right: auto; }
      }

      /* Threads */
      .thread-card { display: flex; flex-direction: column; align-items: stretch; height: 100%; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 1rem; }
      .thread-card.settled { background: var(--surface-alt); opacity: 0.85; }
      .thread-card h3, .thread-card h4 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; line-height: 1.3; margin: 0 0 0.375rem; }
      .stack { display: grid; gap: 0.75rem; align-items: stretch; }
      .stack > * { min-width: 0; }

      /* Maps */
      @keyframes pinpulse { 0% { box-shadow: 0 0 0 0 rgba(224,179,84,0.5); } 70% { box-shadow: 0 0 0 10px rgba(224,179,84,0); } 100% { box-shadow: 0 0 0 0 rgba(224,179,84,0); } }
      @keyframes pindrop { 0% { opacity: 0; margin-top: -18px; } 60% { opacity: 1; margin-top: 2px; } 100% { opacity: 1; margin-top: 0; } }
      /* Stonetop-type numbered pins: rust diamond head with stem, bottom anchored */
      @keyframes headglow { 0% { box-shadow: 0 0 0 0 rgba(156,52,24,0.45); } 70% { box-shadow: 0 0 0 9px rgba(156,52,24,0); } 100% { box-shadow: 0 0 0 0 rgba(156,52,24,0); } }
      @keyframes ringx { 0% { transform: translate(-50%, -50%) scale(0.55); opacity: 0.85; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
      @keyframes pindrop2 { 0% { opacity: 0; transform: translateY(-18px); } 60% { opacity: 1; transform: translateY(2px); } 100% { opacity: 1; transform: translateY(0); } }
      .map-pin.diamond {
        flex-direction: column; height: auto; width: auto; min-height: 0;
        border: 0; border-radius: 0; background: none; box-shadow: none; color: inherit;
      }
      /* The drop-in plays only on a pin's first-ever appearance (the
         .drop-in class is added once per pin by buildPins). It must never
         be part of the resting animation: buildPins rebuilds the pin layer
         on every select, move, and refresh, and a resting drop animation
         replays from opacity 0 on every rebuild, which made pins flash
         the drop and vanish whenever anything was dragged or moved. */
      .map-pin.diamond.drop-in {
        animation: pindrop2 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      }
      .map-pin.diamond:hover, .map-pin.diamond:focus-visible { filter: none; }
      .pin-top { position: relative; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
      .pin-ring {
        position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; border-radius: 50%;
        border: 2px solid rgba(156,52,24,0.55); pointer-events: none;
        animation: ringx 1.6s ease-out infinite;
      }
      .pin-head {
        position: relative; display: flex; align-items: center; justify-content: center;
        width: 25px; height: 25px; background: #9c3418; border: 1.5px solid #221d13;
        transform: rotate(45deg); transition: transform 0.15s ease, background 0.15s ease;
        animation: headglow 1.6s ease-out infinite;
      }
      .pin-num { transform: rotate(-45deg); color: #fbf7ec; font-size: 12px; font-weight: 700; line-height: 1; }
      .pin-stem { width: 2px; height: 9px; background: #221d13; margin-top: -2px; }
      .map-pin.diamond:hover .pin-head, .map-pin.diamond:focus-visible .pin-head { transform: rotate(45deg) scale(1.16); }
      .map-pin.diamond.selected { background: none; }
      .map-pin.diamond.selected .pin-head { background: #221d13; }
      .map-pin.diamond.pending .pin-head { background: var(--gold); border-style: dashed; }
      .pin-tip {
        position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
        max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        background: #0c0e0a; color: #fbf7ec; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px;
        font-size: 11px; font-weight: 600; line-height: 1.4; pointer-events: none;
        opacity: 0; transition: opacity 0.15s ease; z-index: 6;
      }
      .map-pin:hover .pin-tip, .map-pin:focus-visible .pin-tip { opacity: 1; }
      @media (max-width: 639px) { .pin-tip { display: none; } }
      .compass-rose { position: absolute; z-index: 2; pointer-events: none; }
      .compass-rose svg { display: block; width: 100%; height: 100%; }
      .compass-rose.off { opacity: 0.45; }
      .compass-rose.gm-drag { pointer-events: auto; cursor: grab; touch-action: none; }
      .map-frame {
        position: relative; height: 62dvh; min-height: 340px; touch-action: none; user-select: none; -webkit-user-select: none;
        overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-alt);
      }
      .map-frame:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
      .map-inner { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }

        else if (state.view === "primer") renderPrimer(main);
        else if (state.view === "chronicle") renderChronicle(main);
        else if (state.view === "timeline") renderTimeline(main);
        else if (state.view === "people") renderPeople(main);
        else if (state.view === "maps") renderMaps(main);
        else if (state.view === "mysteries") renderMysteries(main);
        else if (state.view === "submit") renderSubmit(main);
        else if (state.view === "gmsignin") renderGmSignIn(main);
        else if (state.view === "gm") renderGm(main);
        var foot = document.createElement("footer");
        foot.className = "site";
        foot.innerHTML = esc(siteText("footer.sync")) + '<br><span data-sync-status>' + esc(syncLine()) + "</span>";
        main.appendChild(foot);
        decorateSiteText(document.body);
      }
      function renderFooterOnly(main) {
        var foot = document.createElement("footer");
        foot.className = "site";
        foot.innerHTML = esc(siteText("footer.sync")) + '<br><span data-sync-status>' + esc(syncLine()) + "</span>";
        main.appendChild(foot);
      }
    </script>

    <script>
      "use strict";
      // ---------- Site text editing (GM only) ----------
      function decorateSiteText(root) {
        if (!gmIsUnlocked() || !state.siteEditMode || !root) return;
        var els = root.querySelectorAll("[data-st]");
        for (var i = 0; i < els.length; i++) {
          (function (el) {
            if (el.getAttribute("data-st-wired")) return;
            el.setAttribute("data-st-wired", "1");
            el.classList.add("st-editable");
            el.setAttribute("title", "Click to edit this wording");
            el.addEventListener("click", function (ev) {
              ev.preventDefault(); ev.stopPropagation();
              openSiteTextEditor(el, el.getAttribute("data-st"));
            });
          })(els[i]);
        }
      }
      function openSiteTextEditor(anchor, key) {
        var oldPanel = document.getElementById("stEditor");
        if (oldPanel) oldPanel.remove();
        var current = siteText(key);
        var panel = document.createElement("div");
        panel.id = "stEditor";
        panel.className = "img-ctrl";
        panel.innerHTML = '<p class="small" style="margin:0 0 0.5rem"><strong>Editing site text:</strong> ' + esc(key) + '</p>'
          + '<label class="gm-field" style="margin-top:0"><span class="sr-only">New wording</span><textarea id="stText" class="search-input" rows="3">' + esc(current) + "</textarea></label>"
          + '<p class="small" id="stMsg" role="status" style="margin:0.5rem 0 0"></p>'
          + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem">'
          + '<button type="button" class="btn btn-deep" id="stSave">Save</button>'
          + '<button type="button" class="btn btn-outline" id="stCancel">Cancel</button>'
          + '<button type="button" class="ghost-btn" id="stRestore">Restore original</button></div>';
        anchor.parentNode.insertBefore(panel, anchor.nextSibling);
        panel.scrollIntoView({ block: "nearest" });
        document.getElementById("stCancel").addEventListener("click", function () { panel.remove(); });
        document.getElementById("stSave").addEventListener("click", function () {
          var value = document.getElementById("stText").value;
          var msg = document.getElementById("stMsg");
          if (!sb) { msg.textContent = "Live sync is not connected, so the change cannot be saved."; return; }
          sb.from("site_text").upsert({ text_key: key, value: value, updated_by: "gm" }, { returning: "minimal" }).then(function (res) {
            if (res.error) { msg.textContent = "The change could not be saved. Live sync is not connected."; return; }
            var before = current;
            SITE_TEXT[key] = value; siteTextTableOk = true;
            fileReviewItem("site_text", "Site text change: " + key, "Changed from: " + before + "\n\nChanged to: " + value, key);
            render();
          }, function () { msg.textContent = "The change could not be saved. Live sync is not connected."; });
        });
        document.getElementById("stRestore").addEventListener("click", function () {
          var msg = document.getElementById("stMsg");
          if (!sb) { msg.textContent = "Live sync is not connected, so the original cannot be restored right now."; return; }
          sb.from("site_text").delete({ returning: "minimal" }).eq("text_key", key).then(function (res) {
            if (res.error) { msg.textContent = "The original could not be restored. Live sync is not connected."; return; }
            delete SITE_TEXT[key];
            fileReviewItem("site_text", "Site text restored: " + key, "Restored to the original wording: " + siteText(key), key);
            render();
          }, function () { msg.textContent = "The original could not be restored. Live sync is not connected."; });
        });
      }

      // ---------- Content text editing (GM text-edit mode) ----------
      // Site wording (data-st, above) is only half the text on the site.
      // The rest lives in content rows: article titles and bodies, people,
      // chronicle entries, mystery threads, and the GM secrets and notes.
      // With Edit site text turned on, every one of those gets an editor
      // that saves back to its own table, so in GM mode every piece of
      // text on the site can be changed. Lore and chronicle saves also set
      // is_hand_edited, so a later content refresh cannot overwrite them.
      function canEditText() { return gmIsUnlocked() && !!state.siteEditMode; }
      var CONTENT_TEXT = {
        lore: { table: "lore_entries", noun: "Article", fields: [
          { k: "title", label: "Title", type: "input" },
          { k: "category", label: "Category", type: "input" },
          { k: "body", label: "Article text", type: "area", rows: 14 }
        ] },
        person: { table: "people", noun: "Person", fields: [
          { k: "name", label: "Name", type: "input" },
          { k: "role", label: "Role", type: "input" },
          { k: "description", label: "Description", type: "area", rows: 8 },
          { k: "status", label: "Status", type: "input" }
        ] },
        chronicle: { table: "chronicle_entries", noun: "Chronicle entry", fields: [
          { k: "date", label: "In-world date", type: "input", db: "in_world_date" },
          { k: "title", label: "Title", type: "input" },
          { k: "body", label: "Entry text", type: "area", rows: 10, db: "entry_text" }
        ] },
        thread: { table: "threads", noun: "Thread", fields: [
          { k: "title", label: "Title", type: "input" },
          { k: "detail", label: "Detail", type: "area", rows: 8, db: "thread_text" },
          { k: "status", label: "Status", type: "select", options: [["open", "Open"], ["resolved", "Settled"]] }
        ] },
        secret: { table: "gm_secrets", noun: "GM secret", fields: [
          { k: "title", label: "Title", type: "input" },
          { k: "body", label: "Text", type: "area", rows: 10 }
        ] },
        note: { table: "gm_notes", noun: "GM note", fields: [
          { k: "title", label: "Title", type: "input" },
          { k: "body", label: "Text", type: "area", rows: 10, db: "note_text" }
        ] }
      };
      function contentItemByKind(kind, id) {
        var list = kind === "lore" ? visibleLore() : kind === "person" ? visiblePeople()
          : kind === "chronicle" ? visibleChronicle() : kind === "thread" ? DATA.threads
          : kind === "secret" ? GM.secrets : kind === "note" ? GM.notes : [];
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }
      function contentTextSectionHtml(kind, item) {
        var cfg = CONTENT_TEXT[kind];
        if (!cfg || !item) return "";
        var html = '<section class="img-ctrl" aria-label="Edit text" data-ctext="' + kind + ":" + item.id + '">'
          + '<p class="small" style="margin:0"><strong>Edit this ' + esc(cfg.noun.toLowerCase()) + "\u2019s text (GM):</strong></p>";
        cfg.fields.forEach(function (f) {
          if (f.type === "area") {
            html += '<label class="gm-field"><span>' + esc(f.label) + '</span><textarea data-ctfield="' + f.k + '" class="search-input" rows="' + (f.rows || 6) + '">' + esc(item[f.k] || "") + "</textarea></label>";
          } else if (f.type === "select") {
            html += '<label class="gm-field"><span>' + esc(f.label) + '</span><select data-ctfield="' + f.k + '" class="search-input">';
            f.options.forEach(function (o) { html += '<option value="' + esc(o[0]) + '"' + (item[f.k] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>"; });
            html += "</select></label>";
          } else {
            html += '<label class="gm-field"><span>' + esc(f.label) + '</span><input type="text" data-ctfield="' + f.k + '" class="search-input" value="' + esc(item[f.k] || "") + '"></label>';
          }
        });
        html += '<p class="small" data-ctmsg role="status" style="margin:0.5rem 0 0"></p>'
          + '<div style="margin-top:0.5rem"><button type="button" class="btn btn-deep" data-ctsave>Save text</button></div></section>';
        return html;
      }
      function saveContentText(kind, item, section) {
        var cfg = CONTENT_TEXT[kind];
        var msg = section.querySelector("[data-ctmsg]");
        if (!sb) { if (msg) msg.textContent = "Live sync is not connected, so the change cannot be saved."; return; }
        var values = {}, patch = {};
        cfg.fields.forEach(function (f) {
          var el = section.querySelector('[data-ctfield="' + f.k + '"]');
          values[f.k] = el ? el.value : (item[f.k] || "");
          patch[f.db || f.k] = values[f.k];
        });
        if (kind === "lore" || kind === "chronicle") patch.is_hand_edited = true;
        sb.from(cfg.table).update(patch, { returning: "minimal" }).eq("id", item.id).then(function (res) {
          if (res.error) { if (msg) msg.textContent = "That text could not be saved. Live sync may not allow this edit."; return; }
          cfg.fields.forEach(function (f) { item[f.k] = values[f.k]; });
          var summary = cfg.fields.map(function (f) { return f.label + ": " + values[f.k]; }).join("\n\n").slice(0, 2000);
          fileReviewItem("site_text", "Text edited: " + cfg.noun + " \u2014 " + (values.title || values.name || item.title || item.name || item.id), summary, item.key || String(item.id));
          render();
        }, function () { if (msg) msg.textContent = "That text could not be saved. Live sync may not allow this edit."; });
      }
      function wireContentTextSections(root) {
        if (!root) return;
        var sections = root.querySelectorAll("[data-ctext]");
        for (var i = 0; i < sections.length; i++) {
          (function (section) {
            if (section.getAttribute("data-ctwired")) return;
            section.setAttribute("data-ctwired", "1");
            var parts = section.getAttribute("data-ctext").split(":");
            var kind = parts[0], id = Number(parts[1]);
            var btn = section.querySelector("[data-ctsave]");
            if (btn) btn.addEventListener("click", function () {
              var item = contentItemByKind(kind, id);
              if (item) saveContentText(kind, item, section);
            });
          })(sections[i]);
        }
      }
      function textEditBtnHtml(kind, id) {
        if (!canEditText()) return "";
        return '<button type="button" class="ghost-btn" data-textedit="' + kind + ":" + id + '" style="margin-top:0.5rem">Edit text</button>';
      }
      function wireTextEditButtons(root) {
        if (!root) return;
        var btns = root.querySelectorAll("[data-textedit]");
        for (var i = 0; i < btns.length; i++) {
          (function (btn) {
            if (btn.getAttribute("data-tewired")) return;
            btn.setAttribute("data-tewired", "1");
            btn.addEventListener("click", function (ev) {
              ev.preventDefault(); ev.stopPropagation();
              var parts = btn.getAttribute("data-textedit").split(":");
              openContentTextEditor(btn, parts[0], Number(parts[1]));
            });
          })(btns[i]);
        }
      }
      function openContentTextEditor(anchor, kind, id) {
        var item = contentItemByKind(kind, id);
        if (!item) return;
        var oldPanel = document.getElementById("ctEditor");
        if (oldPanel) oldPanel.remove();
        var holder = document.createElement("div");
        holder.id = "ctEditor";
        holder.innerHTML = contentTextSectionHtml(kind, item)
          + '<div style="margin-top:0.5rem"><button type="button" class="btn btn-outline" id="ctClose">Close editor</button></div>';
        anchor.parentNode.insertBefore(holder, anchor.nextSibling);
        holder.scrollIntoView({ block: "nearest" });
        wireContentTextSections(holder);
        document.getElementById("ctClose").addEventListener("click", function () { holder.remove(); });
      }

      // ---------- Image controls (GM only) ----------
      function libPickerHtml(selectedId) {
        var html = '<div class="lib-grid" data-libgrid>';
        CONTENT_IMAGES.forEach(function (im) {
          html += '<button type="button" class="lib-cell' + (selectedId === im.id ? " sel" : "") + '" data-libpick="' + im.id + '"><img src="' + esc(im.image_url) + '" alt=""><span>' + esc(im.filename) + "</span></button>";
        });
        if (CONTENT_IMAGES.length === 0) html += '<p class="small muted">The image library is empty. Upload a new image below.</p>';
        return html + "</div>";
      }
      function coverControlHtml(kind, target) {
        var c = coverOf(target);
        var noun = kind === "lore" ? "article" : "person";
        return '<section class="img-ctrl" aria-label="Cover image controls" data-coverctrl="' + kind + ":" + target.id + '">'
          + '<p class="small" style="margin:0"><strong>Cover image (GM):</strong> ' + (c ? "set, framed as stored" : "none yet") + "</p>"
          + '<div style="margin-top:0.5rem">' + libPickerHtml(target.coverImageId) + "</div>"
          + '<label class="gm-field"><span>Or upload a new image</span><input type="file" accept="image/*" data-coverfile class="search-input"></label>'
          + '<div class="frame-box' + (kind === "person" ? " portrait" : " lore") + '" data-framebox style="margin-top:0.75rem;' + (c ? "" : "display:none") + '">' + (c ? framedImgHtml(c, "", noun === "article" ? target.title : target.name) : "") + "</div>"
          + '<div style="display:grid;gap:0.5rem;margin-top:0.75rem">'
          + '<label class="small">Fit <select data-fit class="search-input"><option value="cover"' + (target.coverFit === "cover" ? " selected" : "") + '>Fill the frame</option><option value="contain"' + (target.coverFit === "contain" ? " selected" : "") + ">Fit whole image</option></select></label>"
          + '<label class="small">Slide across: <span data-fxval>' + num(target.coverFocalX, 50) + '%</span><input type="range" min="0" max="100" step="1" value="' + num(target.coverFocalX, 50) + '" data-fx></label>'
          + '<label class="small">Slide down: <span data-fyval>' + num(target.coverFocalY, 50) + '%</span><input type="range" min="0" max="100" step="1" value="' + num(target.coverFocalY, 50) + '" data-fy></label>'
          + '<label class="small">Zoom: <span data-zmval>' + num(target.coverZoom, 1) + '</span><input type="range" min="1" max="3" step="0.05" value="' + num(target.coverZoom, 1) + '" data-zm></label>'
          + "</div>"
          + '<p class="small" data-covermsg role="status" style="margin:0.5rem 0 0"></p>'
          + '<div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-coversave>Save cover image</button>'
          + (target.coverImageId || target.coverUrl ? '<button type="button" class="btn btn-outline" data-coverremove>Remove cover image</button>' : "") + "</div></section>";
      }
      function wireCoverControl(root, kind, target) {
        var section = root.querySelector('[data-coverctrl="' + kind + ":" + target.id + '"]');
        if (!section) return;
        var selId = target.coverImageId || null;
        var selUrl = target.coverUrl || null;
        var file = null;
        function currentCover() {
          return {
            url: selUrl || imageForKey(target.imageKey), fit: section.querySelector("[data-fit]").value,
            fx: Number(section.querySelector("[data-fx]").value), fy: Number(section.querySelector("[data-fy]").value),
            zoom: Number(section.querySelector("[data-zm]").value)
          };
        }
        function refreshPreview() {
          var c = currentCover();
          var box = section.querySelector("[data-framebox]");
          if (!c.url) { box.style.display = "none"; box.innerHTML = ""; return; }
          box.style.display = "";
          box.innerHTML = framedImgHtml(c, "", "");
          var img = box.querySelector("img");
          if (img) { img.style.height = "100%"; img.style.width = "100%"; }
          section.querySelector("[data-fxval]").textContent = c.fx + "%";
          section.querySelector("[data-fyval]").textContent = c.fy + "%";
          section.querySelector("[data-zmval]").textContent = c.zoom;
        }
        var picks = section.querySelectorAll("[data-libpick]");
        for (var i = 0; i < picks.length; i++) picks[i].addEventListener("click", function () {
          selId = Number(this.getAttribute("data-libpick"));
          var row = null;
          CONTENT_IMAGES.forEach(function (im) { if (im.id === selId) row = im; });
          selUrl = row ? row.image_url : null; file = null;
          var cells = section.querySelectorAll("[data-libpick]");
          for (var j = 0; j < cells.length; j++) cells[j].classList.toggle("sel", Number(cells[j].getAttribute("data-libpick")) === selId);
          refreshPreview();
        });
        section.querySelector("[data-coverfile]").addEventListener("change", function () {
          file = this.files && this.files[0] ? this.files[0] : null;
          if (file) { selUrl = URL.createObjectURL(file); selId = null; refreshPreview(); }
        });
        ["[data-fit]", "[data-fx]", "[data-fy]", "[data-zm]"].forEach(function (sel) {
          section.querySelector(sel).addEventListener("input", refreshPreview);
        });
        section.querySelector("[data-coversave]").addEventListener("click", function () {
          var msg = section.querySelector("[data-covermsg]");
          var c = currentCover();
          function saveWith(imageId, url, path) {
            var patch = kind === "lore"
              ? { cover_image_url: url, cover_storage_path: path, cover_fit: c.fit, cover_position: c.fx + "% " + c.fy + "%", cover_focal_x: c.fx, cover_focal_y: c.fy, cover_zoom: c.zoom, cover_image_id: imageId }
              : { portrait_url: url, portrait_storage_path: path, portrait_fit: c.fit, portrait_position: c.fx + "% " + c.fy + "%", portrait_zoom: c.zoom, cover_focal_x: c.fx, cover_focal_y: c.fy, cover_image_id: imageId };
            var table = kind === "lore" ? "lore_entries" : "people";
            sb.from(table).update(patch, { returning: "minimal" }).eq("id", target.id).then(function (res) {
              if (res.error) {
                if (path) removeStorageObject(path);
                msg.textContent = "The cover could not be saved. Live sync is not connected.";
                return;
              }
              target.coverUrl = url; target.coverPath = path; target.coverFit = c.fit;
              target.coverPosition = c.fx + "% " + c.fy + "%"; target.coverFocalX = c.fx; target.coverFocalY = c.fy;
              target.coverZoom = c.zoom; target.coverImageId = imageId;
              fileReviewItem("image", "Cover image changed: " + (kind === "lore" ? target.title : target.name), "The cover image and its framing were updated.", target.key);
              msg.textContent = "Saved. Every visitor who can see this " + (kind === "lore" ? "article" : "person") + " now sees this frame.";
            }, function () { msg.textContent = "The cover could not be saved. Live sync is not connected."; });
          }
          if (!sb) { msg.textContent = "Live sync is not connected, so the cover cannot be saved."; return; }
          if (file) {
            msg.textContent = "Uploading.";
            uploadToStorage(file, kind === "lore" ? "covers" : "portraits", target.key).then(function (up) {
              sb.from("content_images").insert({ filename: file.name, storage_path: up.path, image_url: up.url, used_in: kind + ":" + target.id }, { returning: "minimal" }).then(function (res) {
                if (res.error || !res) { removeStorageObject(up.path); msg.textContent = "The upload finished but the library row could not be saved, so the file was removed."; return; }
                loadLiveSoft(function () {
                  var newRow = null;
                  CONTENT_IMAGES.forEach(function (im) { if (im.image_url === up.url) newRow = im; });
                  saveWith(newRow ? newRow.id : null, up.url, up.path);
                });
              }, function () { removeStorageObject(up.path); msg.textContent = "The library row could not be saved, so the uploaded file was removed."; });
            }, function () { msg.textContent = "The upload failed, and nothing was saved."; });
          } else if (selId) {
            var row = null;
            CONTENT_IMAGES.forEach(function (im) { if (im.id === selId) row = im; });
            if (row) saveWith(row.id, row.image_url, row.storage_path);
          } else if (selUrl) {
            saveWith(null, selUrl, target.coverPath || null);
          } else {
            msg.textContent = "Pick an image from the library or upload a new one first.";
          }
        });
        var removeBtn = section.querySelector("[data-coverremove]");
        if (removeBtn) removeBtn.addEventListener("click", function () {
          var msg = section.querySelector("[data-covermsg]");
          if (!sb) { msg.textContent = "Live sync is not connected."; return; }
          var patch = kind === "lore"
            ? { cover_image_url: null, cover_storage_path: null, cover_image_id: null }
            : { portrait_url: null, portrait_storage_path: null, cover_image_id: null };
          sb.from(kind === "lore" ? "lore_entries" : "people").update(patch, { returning: "minimal" }).eq("id", target.id).then(function (res) {
            if (res.error) { msg.textContent = "The cover could not be removed."; return; }
            target.coverUrl = null; target.coverPath = null; target.coverImageId = null;
            render();
          });
        });
        refreshPreview();
      }
      function loadLiveSoft(done) {
        if (!sb) { done(); return; }
        sb.from("content_images").select("id,filename,storage_path,image_url,used_in").then(function (res) {
          if (!res.error) {
            CONTENT_IMAGES = res.data || []; IMAGES = {};
            CONTENT_IMAGES.forEach(function (r) { var k = String(r.filename || "").replace(/\.[a-z0-9]+$/i, ""); if (k && r.image_url) IMAGES[k] = r.image_url; });
          }
          done();
        }, done);
      }

      // ---------- Wiki ----------
      function loreCard(e) {
        var c = coverOf(e);
        return '<button type="button" class="card" data-lore="' + esc(e.key) + '">'
          + (c ? framedImgHtml(c, "thumb", "") : '<span class="thumb-placeholder"><span class="no-art-tag">No art yet</span></span>')
          + '<span class="pad"><span class="cat">' + esc(e.category) + "</span>"
          + '<span class="name">' + esc(e.title) + "</span>"
          + '<span class="excerpt clamp2">' + esc(firstPara(e.body)) + "</span></span></button>";
      }
      function personCard(p, tall) {
        var c = coverOf(p);
        return '<button type="button" class="card" data-person="' + esc(p.key) + '">'
          + (c ? framedImgHtml({ url: c.url, fit: c.fit, fx: c.fx, fy: c.fy, zoom: c.zoom }, "thumb thumb-portrait", "") : '<span class="thumb-placeholder portrait"><span class="no-art-tag">No art yet</span></span>')
          + '<span class="pad"><span class="name">' + esc(p.name) + (p.gmOnly ? ' <span class="gm-badge">GM only</span>' : "") + "</span>"
          + '<span class="role">' + esc(p.role) + "</span>"
          + '<span class="excerpt clamp2">' + esc(p.description) + "</span>"
          + (p.status !== "active" ? '<span class="card-foot"><span class="status-pill">' + esc(p.status) + "</span></span>" : "")
          + "</span></button>";
      }
      function wireCards(main) {
        var loreBtns = main.querySelectorAll("[data-lore]");
        for (var i = 0; i < loreBtns.length; i++) loreBtns[i].addEventListener("click", function () {
          var e = loreByKey(this.getAttribute("data-lore"));
          if (e) { state.reader = { kind: "lore", entry: e }; render(); window.scrollTo(0, 0); }
        });
        var pplBtns = main.querySelectorAll("[data-person]");
        for (var j = 0; j < pplBtns.length; j++) pplBtns[j].addEventListener("click", function () {
          var found = visiblePersonByKey(this.getAttribute("data-person"));
          if (found) {
            state.reader = { kind: "person", person: found };
            if (state.view !== "people") state.view = "people";
            render(); window.scrollTo(0, 0);
          }
        });
      }
      function renderLoreReader(main, e) {
        var c = coverOf(e);
        var figs = figuresFor(e.id);
        var wordCount = String(e.body || "").split(/\s+/).filter(function (w) { return w; }).length;
        var readMin = Math.max(1, Math.round(wordCount / 200));
        var relatedHtml = relatedForLoreHtml(e);

      function wireOneFigureForm(scope, e, figure, onDone) {

              placement: scope.querySelector("[data-figplace]").value, fit: scope.querySelector("[data-figfit]").value,

              zoom: Number(scope.querySelector("[data-figzm]").value), offset_x: figure ? figure.offX : 0, offset_y: figure ? figure.offY : 0,
              image_key: imageKey

            op.then(function (res) {

          }
          if (file) {
            uploadToStorage(file, "covers", e.key).then(function (up) {
              sb.from("content_images").insert({ filename: file.name, storage_path: up.path, image_url: up.url, used_in: "lore:" + e.id }, { returning: "minimal" }).then(function (res) {
                if (res.error) { removeStorageObject(up.path); msg.textContent = "The library row could not be saved, so the uploaded file was removed."; return; }
                saveFig(up.url, up.path, null);
              }, function () { removeStorageObject(up.path); msg.textContent = "The library row could not be saved."; });
            }, function () { msg.textContent = "The upload failed, and nothing was saved."; });
          } else if (selUrl) {
            var row2 = null; if (selId) CONTENT_IMAGES.forEach(function (im) { if (im.id === selId) row2 = im; });
            saveFig(selUrl, row2 ? row2.storage_path : (figure ? figure.storagePath : null), figure ? figure.imageKey : null);

      function renderWiki(main) {

      // A single orientation page for a player joining mid-campaign,

      function renderPrimer(main) {

        var companions = visiblePeople().filter(function (p) { return p.kind === "companion"; });

        var gods = [
          { key: "god-thargrim", kind: "Divine Family", name: "Thargrim the Forgefather", line: "God of the forge and of craft, patriarch of the pantheon. He raised the Obsidian Peaks and founded the Deepholds, and the dwarves hold him above all other gods. Every smith in Caldaryn swears by him; Oakrest\u2019s Forge was blessed by his priests." },
          { key: "god-danuviel", kind: "Divine Family", name: "Danuviel the Skyborn", line: "Goddess of sky and weather, matriarch of the pantheon. She planted the Veilgrove Forest as a sanctuary for the elves, and farmers pray to her for gentle rain while sailors ask her for safe passage." },
          { key: "god-yelna", kind: "Divine Family", name: "Yelna the Hearthmother", line: "Goddess of hearth, home, and the bond of kin. Her flame is the Everlight that burns in Oakrest\u2019s square, halflings hold her above all, and Buddy Hobb-Took is her paladin." },
          { key: "god-vorgrath", kind: "Divine Family", name: "Vorgrath the Hammer of War", line: "God of war: the raw drive to conquer and survive. His priests rallied the human armies in the War of Stone and Iron, and Dietrich Dorn, who travels with the party, is his cleric." },
          { key: "god-ralnath", kind: "Divine Family", name: "Ralnath the Keeper of Shadows", line: "God of shadows and kept secrets, and guide of souls through the passage of death. The elves revere him as part of the natural cycle, and he aided Danuviel in the Binding of the Storm." },
          { key: "god-vaelis", kind: "Divine Family", name: "Vaelis the Prism Warden", line: "God of magic, light, illusion, and warded, changing knowledge. Vaelis raised the Prismspire, the crystal tower whose raising opened an age of learning and artistry." },
          { key: "god-korynth", kind: "Outsider", name: "Korynth the Nexus of Fates", line: "One of the three Outsiders who came through the rift at the Eclipse. Fate unbound: the nexus where threads cross and tangle, and the steward of the Eclipse itself." },
          { key: "god-maldrath", kind: "Outsider", name: "Maldrath the Arcane Tyrant", line: "An Outsider, lord of arcane magic unbound, who twists magic and creation into tools of oppression. His name is one reason human kings hunt magic users who will not serve." },
          { key: "god-xyrrak", kind: "Outsider", name: "Xyrrak the Corruptor", line: "An Outsider, the corrupter: the voice in the shadows that offers forbidden truths at a terrible price. The whispering idol that nearly took the party bore his symbol, carved into black stone." },
          { key: "god-nytheris", kind: "Born of the Eclipse", name: "Nytheris the Veilspinner", line: "Child of Vaelis of the Divine Family and Korynth the Outsider, born of the Eclipse itself: neither wholly of the ordered gods nor wholly of the chaos that came through the rift. The Veilspinner walks between." }
        ];
        var peoples = [
          { key: "species-humans", name: "Humans", line: "The most expansionist people in Caldaryn. They arrived from another continent within living memory of the elves and have not slowed since, building city-states that tax, expand, and press into dwarven, elven, and halfling lands. Their rulers persecute magic users, unless those users serve." },
          { key: "species-dwarves", name: "Dwarves", line: "A proud, resilient people bound to mountains and earth, dwelling in the Deepholds, vast cities carved into the peaks. Unparalleled smiths and stoneworkers, slow to trust and unwavering once given. Thargrim the Forgefather guides them." },
          { key: "species-elves", name: "Elves", line: "Ancient, long-lived, and forest-dwelling, attuned to nature and to magic in ways that make humans nervous. Their homeland is the Veilgrove Forest, and the Emerald Glades are a named region within it. The elves are its stewards, and of late they are vanishing deeper into the trees." },
          { key: "species-halflings", name: "Halflings", line: "Cheerful, resourceful folk of strong community, dwelling in quiet villages among rolling hills and riverbanks, Hearthhaven first among them. Overlooked by the great powers, which suits them. They worship Yelna the Hearthmother." },
          { key: "drow", name: "Drow", line: "A people of the dark places, said to fuse with spiders and to fear the sun as a vampire does. To see one above ground in daylight would be unheard of. The party has met their traces in ruins and deep places, and no more than that is certain." },
          { key: "species-gnomes", name: "Gnomes", line: "Gnomes exist in Caldaryn. The setting notes confirm them plainly and say little more that the party has yet encountered, so this page does the same." }
        ];

          { key: "place-oakrest", map: "oakrest", kind: "Home", name: "Oakrest", line: "Where the story began: a frontier town of about 800 souls at the edge of the Veilgrove, founded as a logging camp around 650 BE and grown on timber, metalwork, and trade. The Everlight Lantern burns in its square, the Forge makes its living, and Warden Roderic Vale and Elder Myra govern it." },
          { key: "place-veilgrove", map: null, kind: "The wilds at home", name: "The Veilgrove Forest", line: "The ancient woodland Danuviel planted around 1000 BE, saturated with natural magic, where the barrier between mortal and divine runs thin. It is the elven homeland; the Emerald Glades are a named region inside it. Oakrest\u2019s old pact with Lunara\u2019s wolves was made at its edge." },
          { key: "place-solren", map: null, kind: "South, on the road", name: "Solren", line: "A great human city of some 11,000, about a week on foot from Oakrest, or about four days by boat. Its Starforge, a floating forge lit by enchanted light, makes the finest arms in the region. Lord Nethor rules Solren: he answers to the city\u2019s Merchant Council, but the final decision is his, and the Secret Council of Smiths, who oversee the Starforge, holds sway with the merchants." },
          { key: "place-fenwatch", map: null, kind: "North, on the road", name: "Fenwatch", line: "A busy trade town where the roads meet the river, home to counting houses like the Copperveins\u2019 and the Split Oar tavern, where travelers from three cities told the same story about Oakrest iron. The courier job that changed everything was taken here." },
          { key: "place-seaward", map: "seaward", kind: "The eastern coast", name: "Seaward", line: "A small, windswept fishing village on the eastern coast, founded when a divine figure guided its first settlers through a great storm. Elder Taren Clifftide leads it, and its fishers keep the rites of Neriath, the sea demigod." },
          { key: "place-karak-torun", map: null, kind: "The eastern coast", name: "Karak Torun", line: "The Forge of Kings: a mighty dwarven stronghold on an island off the eastern coast, as the map of Caldaryn shows it. Seat of the Forge-King, keeper of the deepest forges, and source of the realm\u2019s finest arms, armor, and worked mithril." },
          { key: "place-ashenport", map: null, kind: "The southern coast", name: "Ashenport", line: "A bustling port city south of Solren, named for its gray cliffs and sea mist, governed by the Mariner\u2019s Council and proud of its shipyards, which are second to none. It is Solren\u2019s rival for trade, and it fiercely resists Solren\u2019s influence." },
          { key: "place-starfall-lake", map: null, kind: "On the party\u2019s road", name: "Starfall Lake", line: "A broad, dark lake the party crossed by night on the 4th of Dawnsow, ferried by Harlan Vaughn. A riderless horse eating human bones waited on its shore, a cursed dagger buried in its flank, and Parnassus caught the fish that carried Yelna\u2019s pendant." },
          { key: "place-thalanthir", map: null, kind: "East of Fenwatch", name: "Thalanthir", line: "A settlement known as a gathering place for old scholars, relic hunters, and cloistered folk with an unhealthy interest in dead empires. The sealed crate the party was hired to carry was bound for Thalanthir, before the party decided otherwise." },
          { key: "place-ashen-hollows", map: null, kind: "Where the party stands", name: "The Ashen Hollows", line: "The seat of Naevor Athzin of the Hallow Helm when she is not wandering. The party reached its lip at dawn on the 9th of Dawnsow, carrying the child to her, and Drazhic\u2019s challenge went unanswered." }
        ];
        var history = [
          { date: "c. 1200 BE", title: "The Shaping of the Peaks", line: "Thargrim strikes the earth with his hammer, raising the Obsidian Peaks and founding the Deepholds for the dwarves. The sources call this the beginning of organized civilization and divine influence among mortals.", chips: primerLoreChip("place-obsidian-peaks") },
          { date: "c. 1000 BE", title: "The Veilgrove is planted", line: "Danuviel plants the Veilgrove Forest, a sanctuary for the elves and a lasting symbol of natural harmony, in the age the records call the Age of Balance.", chips: primerLoreChip("history-creation-veilgrove") },
          { date: "750\u2013700 BE", title: "The War of Stone and Iron", line: "Humans, under Vorgrath\u2019s influence, war on the dwarves for the iron, mithril, and gold of the Peaks, and the war lasts that whole span. Elanor Brightquill\u2019s chronicle of 744 BE is her own firsthand account, written from inside it. The war ends in a fragile alliance of dwarves and elves, and divisions that have never healed.", chips: primerLoreChip("history-war-stone-iron") },
          { date: "Year 0", title: "The Eclipse", line: "The sun and the twin moons Lunaris and Myrieth align, the skies darken, and a rift tears open in reality. Through it come the Outsiders. The Divine Family\u2019s unity fractures, cults to the Outsiders form, magic runs uncontrolled, and Nytheris is born. Every year since is counted from this day.", chips: primerLoreChip("history-eclipse") },
          { date: "c. 86\u201391 AE", title: "Sela is lost near Fenwatch", line: "Sela, a quiet, honest cloth merchant, is lost on the road north of Fenwatch: his wagon found overturned, his body never recovered. Fenwatch accepts him dead and his widow leaves with the children. What became of him is a live question on the party\u2019s road again.", chips: primerLoreChip("place-fenwatch") },
          { date: "c. 91 AE", title: "Umberland vanishes; the couriers begin", line: "Lord Sheamus Umberland disappears, and his supply line begins its strange run: a courier bearing a simple iron oak-leaf token every ten to twelve weeks, never the same face twice, provisioned in Fenwatch by Sylvin Coppervein, who asks no questions and answers none.", chips: primerLoreChip("org-oak-leaf-couriers") },
          { date: "101 AE", title: "The road begins", line: "A century after the Eclipse, in the planting month of Greenswell, a small company is blessed at Oakrest\u2019s Festival of Seeds. Everything after that is the Chronicle, and it is still being written.", chips: primerViewChip("chronicle", "Read the Chronicle") }
        ];
        var beats = [
          { date: "8th of Greenswell", title: "The Festival of Seeds", line: "Oakrest closes the planting season beneath the Everlight Lantern, and the company is publicly blessed in the square. The next morning, the road begins." },
          { date: "9th of Greenswell", title: "The pact, the idol, the forge fire", line: "Lunara, the great wolf, shows the party the old pact between Oakrest and the forest, and how the Cult of the Spiral poisoned it. In the blacksmith\u2019s shed the whispering idol nearly takes Ivy; Loryn Farrow hurls it into the forge fire because she told him to, crying for him to unmake it. The cult breaks. But Granny Widdershins\u2019 telling is the one that matters: the fire married the whisper to the forge, and to all the iron worked since." },
          { date: "10th to 13th of Greenswell", title: "Anya, the tower, and Naevor at the gate", line: "Anya, who heard the voice first, flees west and is killed at the ruined watchtower; by morning her body is gone, a spiral burned into the earth where she fell. Elias, who carried the idol, is found dead with no wound on him. Naevor Athzin of the Hallow Helm comes to Oakrest, takes the tainted lantern, and names the Ashen Hollows as the place she can be found." },
          { date: "12th of Greenswell and after", title: "The ambush and the black ichor", line: "Hallow Helm mercenaries in sealed iron helms ambush the party on a granite ridge, and pour black ichor down the throats of the fallen. It saves them, and it begins to work on them: craving, cold emptiness, a severed warmth. Lanna of the Root and Hollow names it plainly: not a conduit, a scout, something reaching out through whoever takes it in." },
          { date: "Greenswell, on the road", title: "Solren, the circus, Fenwatch", line: "The road runs south to Solren, its Starforge, sewers, and bounty talk at the Barrow\u2019s Lid, then north again: the Painted Ring Circus crossed at a flooded river, and Fenwatch, where Sylvin Coppervein makes contact and the Split Oar\u2019s travelers all tell the same story, Oakrest iron blackening and spoiling in three cities at once." },
          { date: "1st of Dawnsow", title: "The Courier Job", line: "The party is hired to carry a sealed crate north toward Thalanthir. The crate hums. Its quiet begins to fail. Something thin takes to following the party, and does not stop." },
          { date: "4th of Dawnsow", title: "Starfall Lake, and a decision", line: "On the road: a fork ambush, a search for Sela, and Sylvin\u2019s confidences. At Starfall Lake, the cursed dagger is drawn from a dead horse\u2019s flank and takes Ivy\u2019s hand before it is mastered. The party decides the box does not go to Thalanthir. It goes to Naevor." },
          { date: "8th of Dawnsow", title: "The Dryad\u2019s Glade: the crate is opened", line: "In the dryad\u2019s glade, safe from the wraith by the forest\u2019s own ways, the crate is opened. Inside, held in time-stasis apart from hunger, thirst, and time itself: a living newborn girl. It appears she is an elf. Trillik speaks the Shadowborn verse over her: a mortal touched by all gods, destined to reshape the world." },

          + '<section class="primer-section" id="primer-start" aria-label="Start here"><h3 data-st="primer.h.start">' + esc(stVal("primer.h.start", "Start here")) + "</h3>"

          + '<section class="primer-section" id="primer-world" aria-label="The world in one page"><h3 data-st="primer.h.world">' + esc(stVal("primer.h.world", "The world in one page")) + "</h3>"
          + '<p data-st="primer.world.1">' + esc(stVal("primer.world.1", "Caldaryn is the known continent: a realm of divided kingdoms, sprawling wilds, and ancient ruins whispered about in stories. Most folk live simple lives in small villages, toiling the fields and keeping to old traditions. Beyond the safety of the village walls the world is dangerous: shadowy forests, crumbling towers, wild beasts, and things older than any of them. Occasionally a merchant passes through with news. That is usually enough.")) + "</p>"
          + '<p data-st="primer.world.2">' + esc(stVal("primer.world.2", "Human Caldaryn is a patchwork of fiercely independent city-states, each jealous of its walls, its trade, and its gods, cooperating only when profit or danger demands it. The older peoples were here first: dwarves in their mountain Deepholds, elves in the great forest, halflings in their hearth villages. Humans arrived from another continent and have pressed into their lands ever since. Within the last hundred years the open war between humans and the demi-humans stopped; what followed is a cessation of hostilities, not a peace, and everyone old enough knows the difference.")) + "</p>"
          + '<p data-st="primer.world.3">' + esc(stVal("primer.world.3", "The years are counted from the Eclipse: BE before it, AE after it, the Eclipse itself year 0, and the year now is 101 AE. The year holds twelve months of thirty days on a six-day week. The party\u2019s road began in Greenswell, the planting month, and has reached Dawnsow, the growing season. Overhead turn the twin moons, Lunaris and Myrieth, and their behavior is watched closely, because the Second Eclipse prophecy says to watch it.")) + "</p>"

          + '<p data-st="primer.where.1">' + esc(stVal("primer.where.1", "The road is at dawn on the 9th of Dawnsow, Year 101 AE, the day shown at the top of every page of this site, which moves forward as the story does. The party stands at the lip of the Ashen Hollows with a newborn in arms, a cursed dagger in a pack, a wraith behind, and a zealot ahead: Naevor Athzin, to whom the party decided to bring the child. For scale, home is far behind: Oakrest to Solren is about a week on foot, or about four days by boat, and the party has walked most of that axis, and beyond, to get here.")) + "</p>"

          + '<p data-st="primer.gods.intro">' + esc(stVal("primer.gods.intro", "Caldaryn\u2019s counted pantheon is ten. Six are the Divine Family, the old gods of the world, who shaped its peaks and forests and squabble like any family. Three are the Outsiders, who came through the rift the Eclipse tore in year 0 and were never meant to be here. The tenth, Nytheris, was born of the Eclipse itself, one parent from each side. Beyond the ten, Seaward keeps Neriath, a demigod of the sea: not one of the counted gods, honored at her Driftwood Shrine and in the Storm Lantern Vigil, and her lore will grow if the party crosses her path.")) + "</p>"

      // ---------- Chronicle ----------
      function renderChronicle(main) {
        var entries = visibleChronicle().slice().sort(function (a, b) { return b.sortKey - a.sortKey; });
        var html = '<div style="margin-top:1.5rem"><h2 class="view-title" data-st="chronicle.title">' + esc(stVal("chronicle.title", "The Chronicle")) + "</h2>"
          + '<p class="small muted" style="margin-top:0.25rem" data-st="chronicle.intro">' + esc(siteText("chronicle.intro")) + "</p>"
          + (gmIsUnlocked() ? '<p class="small" style="margin-top:0.25rem">GM signed in: the GM-only entries are shown here and marked. Signed-out visitors see the player entries only.</p>' : "")
          + syncNoticeHtml()
          + '<ol class="timeline">';
        entries.forEach(function (e) {
          var isGm = !!e.gmOnly;
          var focus = state.chronicleFocus && state.chronicleFocus === e.key;
          var rel = scanMentions(e.title + " " + e.body, { chronKey: e.key });
          var relChips = [];

        if (gmIsUnlocked()) {
