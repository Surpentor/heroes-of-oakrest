          html += coverControlHtml("person", p);
        }
        html += "</article>";
        main.innerHTML = html;
        document.getElementById("backBtn").addEventListener("click", function () { if (!navGoBack()) { state.reader = null; render(); } });
        wireSuggestButtons(main);
        wireArtSuggest(main);
        wireWikiLinks(main);
        if (gmIsUnlocked()) { wireContentTextSections(main); wireCoverControl(main, "person", p); }
        decorateSiteText(main);
      }
      function renderPeople(main) {
        if (state.reader && state.reader.kind === "person") { renderPersonReader(main, state.reader.person); return; }
        var q = state.peopleQ.trim().toLowerCase();
        var list = visiblePeople().filter(function (p) {
          return !q || p.name.toLowerCase().indexOf(q) !== -1 || p.role.toLowerCase().indexOf(q) !== -1 || p.description.toLowerCase().indexOf(q) !== -1;
        });
        var groups = [
          { title: stVal("people.group.pc", "The Heroes"), stKey: "people.group.pc", items: list.filter(function (p) { return p.kind === "pc"; }) },
          { title: stVal("people.group.companion", "Companions of the Road"), stKey: "people.group.companion", items: list.filter(function (p) { return p.kind === "companion"; }) },
          { title: stVal("people.group.npc", "People of Caldaryn"), stKey: "people.group.npc", items: list.filter(function (p) { return p.kind === "npc"; }) }
        ];
        var html = '<div style="margin-top:1.5rem"><h2 class="view-title" data-st="people.title">' + esc(stVal("people.title", "People")) + "</h2>"
          + syncNoticeHtml()
          + '<label style="display:block;margin-top:0.75rem"><span class="sr-only">Search people</span>'
          + '<input type="search" id="peopleSearch" class="search-input" placeholder="Search people\u2026" value="' + esc(state.peopleQ) + '"></label>';
        groups.forEach(function (g) {
          if (g.items.length === 0) return;
          html += '<section style="margin-top:1.75rem"><h3 class="font-display" style="font-size:1.25rem;font-weight:600;color:var(--accent-deep);margin:0" data-st="' + g.stKey + '">'
            + esc(g.title) + ' <span class="small" style="font-weight:400;color:var(--dim)">(' + g.items.length + ")</span></h3>"
            + '<div class="grid2" style="margin-top:0.75rem">';
          g.items.forEach(function (p) { html += personCard(p, true); });
          html += "</div></section>";
        });
        if (!peopleTableOk && dataLoaded) html += '<p style="margin-top:2rem;text-align:center" class="muted">People could not be loaded. Live sync is not connected. Try again.</p>';
        else if (list.length === 0) html += '<p style="margin-top:2rem;text-align:center" class="muted">No one by that name, yet.</p>';
        html += "</div>";
        main.innerHTML = html;
        var search = document.getElementById("peopleSearch");
        search.addEventListener("input", function () {
          state.peopleQ = this.value;
          var pos = this.selectionStart;
          renderPeople(main);
          var s2 = document.getElementById("peopleSearch");
          s2.focus();
          try { s2.setSelectionRange(pos, pos); } catch (err) { /* ok */ }
          var foot = main.querySelector("footer.site"); if (foot) foot.remove();
          renderFooterOnly(main);
        });
        wireCards(main);
        decorateSiteText(main);
      }
    </script>

    <script>
      "use strict";
      // ---------- GM sign in ----------
      function renderGmSignIn(main) {
        if (gmIsUnlocked()) { state.view = "gm"; renderGm(main); return; }
        if (gmSessionFlag() && !gmPayload) {
          main.innerHTML = '<div class="gm-wrap"><h2 class="view-title">GM Sign In</h2>'
            + '<p class="small muted" style="margin-top:0.5rem">This browser session is still open, but the GM content itself is held in memory only, so it was not kept across the reload. Enter the passcode again to load it for this sitting.</p>'
            + gmSignInFormHtml(false)
            + "</div>";
          wireGmSignInForm(main, false);
          return;
        }
        if (state.gmPasscodeState === "unknown") {
          main.innerHTML = '<div class="gm-wrap"><h2 class="view-title">GM Sign In</h2><p class="small muted" style="margin-top:0.5rem">Checking whether a passcode is set for this site.</p></div>';
          if (!sb) {
            state.gmPasscodeState = "unset";
            renderGmSignIn(main); renderFooterOnly(main);
            return;
          }
          gmFetch("").then(function (data) {
            if (data && data.passcode_set === false) state.gmPasscodeState = "unset";
            else if (data && data.passcode_set === true) state.gmPasscodeState = "set";
            else state.gmPasscodeState = "set";
            if (state.view === "gmsignin") { renderGmSignIn(main); renderFooterOnly(main); }
          });
          return;
        }
        var first = state.gmPasscodeState === "unset";
        var html = '<div class="gm-wrap"><h2 class="view-title">' + (first ? "Set the GM passcode" : "GM Sign In") + "</h2>"
          + '<p class="small muted" style="margin-top:0.5rem">' + (first
              ? "No GM passcode is set for this site yet. Set one here. Only its SHA-256 hash is stored, in the site database, and the GM content is fetched only after it checks out."
              : "For the GM only. Enter the passcode set for this site to open the GM section.") + "</p>"
          + gmSignInFormHtml(first)
          + '<p class="small muted" style="margin-top:1rem">A forgotten passcode cannot be recovered from this page, because only its hash is stored. To reset it, delete the gm_passcode_hash row in the Supabase dashboard, then set a new passcode here.</p>'
          + "</div>";
        main.innerHTML = html;
        wireGmSignInForm(main, first);
      }
      function gmSignInFormHtml(first) {
        var html = "";
        if (state.gmError) html += '<p class="gm-error" role="alert">' + esc(state.gmError) + "</p>";
        if (!sb) html += '<p class="gm-error" role="alert">Live sync is not connected, so the GM section cannot be opened right now.</p>';
        html += '<form id="gmForm">'
          + '<label class="gm-field"><span>' + (first ? "New passcode" : "Passcode") + "</span>"
          + '<input type="password" id="gmPw" class="search-input" autocomplete="' + (first ? "new-password" : "current-password") + '" required></label>';
        if (first) {
          html += '<label class="gm-field"><span>Enter it again</span>'
            + '<input type="password" id="gmPw2" class="search-input" autocomplete="new-password" required></label>';
        }
        html += '<div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:0.5rem">'
          + '<button type="submit" class="btn btn-deep">' + (first ? "Set passcode and open GM" : "Open GM") + "</button>"
          + '<button type="button" class="btn btn-outline" id="gmCancel">Back to the wiki</button></div></form>';
        return html;
      }
      function wireGmSignInForm(main, first) {
        var cancel = document.getElementById("gmCancel");
        if (cancel) cancel.addEventListener("click", function () {
          state.gmError = ""; state.view = "wiki"; render();
        });
        var form = document.getElementById("gmForm");
        if (!form) return;
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (!sb) { state.gmError = "Live sync is not connected, so the GM section cannot be opened right now."; renderGmSignIn(main); renderFooterOnly(main); return; }
          var pw = document.getElementById("gmPw").value;
          if (first) {
            var pw2 = document.getElementById("gmPw2").value;
            if (pw.length < 4) { state.gmError = "Use at least four characters, so a stray tap cannot set it by accident."; renderGmSignIn(main); renderFooterOnly(main); return; }
            if (pw !== pw2) { state.gmError = "The two entries do not match. Try again."; renderGmSignIn(main); renderFooterOnly(main); return; }
            sha256Hex(pw).then(function (hex) {
              function saveFailed(msg) { state.gmError = msg || "The passcode could not be saved. Check the connection and try again."; renderGmSignIn(main); renderFooterOnly(main); }
              function saveSucceeded() {
                state.gmPasscodeState = "set";
                gmFetch(pw).then(function (data) {
                  applyGmPayload(data && data.match ? data : { chronicle: [], people: [], secrets: [], notes: [], review_items: [], lore: [] });
                  gmPasscodeMem = pw; gmSetSession();
                  state.gmError = ""; state.view = "gm"; render(); window.scrollTo(0, 0);
                });
              }
              var oldHashPromise = gmPasscodeMem ? sha256Hex(gmPasscodeMem) : Promise.resolve(null);
              oldHashPromise.then(function (oldHash) {
                sb.rpc("gm_set_passcode", { old_hash: oldHash, new_hash: hex }).then(function (res) {
                  if (res.error) { saveFailed(res.error.message || null); return; }
                  var data = res.data;
                  if (!data || data.ok !== true) { saveFailed(data && data.error ? data.error : null); return; }
                  saveSucceeded();
                }, function () { saveFailed(); });
              }, function () { saveFailed(); });
            });
            return;
          }
          gmFetch(pw).then(function (data) {
            if (!data) { state.gmError = "Live sync is not connected, so the passcode cannot be checked right now."; renderGmSignIn(main); renderFooterOnly(main); return; }
            if (data.passcode_set === false) { state.gmPasscodeState = "unset"; state.gmError = ""; renderGmSignIn(main); renderFooterOnly(main); return; }
            if (!data.match) { state.gmError = "That passcode does not match the passcode set for this site."; renderGmSignIn(main); renderFooterOnly(main); return; }
            applyGmPayload(data);
            gmPasscodeMem = pw; gmSetSession();
            state.gmError = ""; state.view = "gm"; render(); window.scrollTo(0, 0);
          });
        });
        var pwInput = document.getElementById("gmPw");
        if (pwInput) pwInput.focus();
      }

      // ---------- GM section ----------
      function tableStatusLinesHtml() {
        function line(name, ok, gmOnly) {
          return '<p class="small" style="margin:0.125rem 0">' + esc(name) + ": " + (ok ? "connected" : "not connected") + (gmOnly ? " (GM only, through the passcode check)" : "") + "</p>";
        }
        return '<div style="margin-top:0.5rem">'
          + line("lore_entries", loreTableOk, false)
          + line("people", peopleTableOk, false)
          + line("chronicle_entries", chronicleTableOk, false)
          + line("map_pins", pinsTableOk, false)
          + line("threads", threadsTableOk, false)
          + line("review_items", reviewTableOk, true)
          + line("site_text", siteTextTableOk, false)
          + line("content_images", contentImagesTableOk, false)
          + line("lore_figures", figuresTableOk, false)
          + line("gm_notes", gmNotesTableOk, true)
          + line("gm_secrets", gmSecretsTableOk, true)
          + line("map_markers", markersTableOk, false)
          + line("map_icons", iconsTableOk, false)
          + line("custom_maps", customMapsTableOk, false)
          + line("maps", mapsTableOk, false)
          + line("settings", settingsTableOk, true)
          + "</div>";
      }
      function renderGm(main) {
        if (!gmIsUnlocked()) { renderGmSignIn(main); return; }
        var siteChanges = GM.review.filter(function (r) { return r.kind === "site_text"; });
        var playerSubs = GM.review.filter(function (r) { return r.kind === "player_submission" || String(r.kind || "").indexOf("player_") === 0; });
        var openReview = GM.review.filter(function (r) { return r.kind !== "site_text" && r.kind !== "player_submission" && String(r.kind || "").indexOf("player_") !== 0; });
        var html = '<div style="margin-top:1.5rem"><h2 class="view-title">GM <span class="gm-badge">GM only</span></h2>'
          + '<div class="gm-note-box"><p style="margin:0"><strong>Read this first: what this gate is.</strong></p>'
          + '<p style="margin:0.5rem 0 0">This gate is now a real server-side gate. GM content is never in this page file and is never sent to the browser until the passcode checks out on the server, through the get_gm_content check. While signed out, this page holds no GM secrets, no GM chronicle entries, no GM people, and no review items, in what it shows or in its source. The payload is kept in memory only for this sitting, and signing out or closing the tab clears it.</p></div>';
        html += '<section aria-label="Site text" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Site Text</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">Turn on Edit site text, and every piece of text on the site becomes editable. Click any gold-outlined wording (headings, introductions, the Primer, the deep-history moments, and the site\u2019s own phrases) to change it where it stands. Articles, people, chronicle entries, mystery threads, and the GM secrets and notes below get an Edit text form or button that saves to the entry itself, and map pins and markers take text edits from their panels and right-click menus. Changes save at once, players see them right away, and each change is recorded below under Site Text Changes. Restore original returns a wording to its first text.</p>'
          + '<button type="button" class="btn ' + (state.siteEditMode ? "btn-deep" : "btn-outline") + '" id="gmEditTextToggle" aria-pressed="' + state.siteEditMode + '">' + (state.siteEditMode ? "Stop editing site text" : "Edit site text") + "</button></section>";
        html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">GM Secrets</h3><div class="stack" style="margin-top:0.75rem">';
        if (GM.secrets.length === 0) html += '<p class="small muted">No GM secrets were returned. Live sync may not be connected, or none are filed yet.</p>';
        GM.secrets.forEach(function (s) {
          html += '<article class="gm-secret-card"><h4>' + esc(s.title) + "</h4>" + bodyHtml(s.body) + textEditBtnHtml("secret", s.id) + "</article>";
        });
        html += "</div>";
        html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">GM People</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">These cards appear in People and in search only while the GM is signed in.</p><div class="grid2" style="margin-top:0.75rem">';
        if (GM.people.length === 0) html += '<p class="small muted">No GM-only people were returned.</p>';
        GM.people.forEach(function (pp) { html += personCard(pp, true); });
        html += "</div>";
        html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">The GM Chronicle Entries</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">These entries complete the full chronicle. While the GM is signed in they also appear in the Chronicle, in story order and marked GM only.</p><ol class="timeline">';
        GM.chronicle.slice().sort(function (a, b) { return b.sortKey - a.sortKey; }).forEach(function (e) {
          html += '<li><span class="dot" aria-hidden="true"></span><p class="date">' + esc(e.date) + ' \u00B7 <span class="gm-badge">GM only</span></p><h3 style="font-family:var(--font-display);font-size:1.125rem;font-weight:600;margin:0.125rem 0 0.375rem">' + esc(e.title) + "</h3>" + bodyHtml(e.body) + textEditBtnHtml("chronicle", e.id) + "</li>";
        });
        html += "</ol>";
        if (GM.lore.length > 0) {
          html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">GM Lore</h3>'
            + '<p class="small muted" style="margin-top:0.25rem">GM-only articles. While signed in they also appear in the Wiki and in search.</p><div class="grid2" style="margin-top:0.75rem">';
          GM.lore.forEach(function (e) { html += loreCard(e); });
          html += "</div>";
        }
        html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">GM Notes</h3><div class="stack" style="margin-top:0.75rem">';
        if (GM.notes.length === 0) html += '<p class="small muted">No GM notes were returned.</p>';
        GM.notes.forEach(function (n) {
          html += '<article class="thread-card"><h4>' + esc(n.title) + "</h4>" + bodyHtml(n.body) + textEditBtnHtml("note", n.id) + "</article>";
        });
        html += "</div>";
        html += '<section aria-label="Player submissions" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Player Submissions <span class="small" style="font-weight:400;color:var(--dim)">(' + playerSubs.length + ' waiting)</span></h3>'
          + '<p class="small muted" style="margin-top:0.25rem">Additions, updates, corrections, and pictures sent in from the Submit page. Nothing a player submits is live yet: resolving marks it accepted so you can make the change (or place the picture) yourself; dismissing marks it dismissed. Pictures are shown below each submission and open full-size on a tap.</p><div class="stack" style="margin-top:0.75rem">';
        if (playerSubs.length === 0) html += '<p class="small muted">No player submissions are waiting.</p>';
        playerSubs.forEach(function (r) {
          html += '<article class="thread-card"><p class="small" style="margin:0 0 0.25rem"><span class="status-pill">Player submission</span> <span class="muted">' + esc(r.kind) + '</span></p><h4>' + esc(r.title) + "</h4>" + bodyHtml(r.body) + reviewImagesHtml(r.body)
            + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-review-resolve="' + r.id + '">Resolve</button><button type="button" class="btn btn-outline" data-review-dismiss="' + r.id + '">Dismiss</button></div></article>';
        });
        html += "</div></section>";
        html += '<section aria-label="Review queue" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Review Queue</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">Open contradictions and questions held for Mike\u2019s ruling. Resolving marks an item accepted; dismissing marks it dismissed. Decided items leave this list.</p><div class="stack" style="margin-top:0.75rem">';
        if (openReview.length === 0) html += '<p class="small muted">The queue is empty.</p>';
        openReview.forEach(function (r) {
          html += '<article class="thread-card"><p class="small" style="margin:0 0 0.25rem"><span class="status-pill">Open</span> <span class="muted">' + esc(r.kind) + '</span></p><h4>' + esc(r.title) + "</h4>" + bodyHtml(r.body)
            + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-review-resolve="' + r.id + '">Resolve</button><button type="button" class="btn btn-outline" data-review-dismiss="' + r.id + '">Dismiss</button></div></article>';
        });
        html += "</div></section>";
        html += '<section aria-label="Site text changes" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Site Text Changes</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">The record of edits to the site\u2019s own wording, filed as each change is saved.</p><div class="stack" style="margin-top:0.75rem">';
        if (siteChanges.length === 0) html += '<p class="small muted">No site text has been changed yet. Press Edit site text, then click any outlined wording.</p>';
        siteChanges.forEach(function (r) {
          html += '<article class="thread-card"><p class="small" style="margin:0 0 0.25rem"><span class="status-pill">Open</span></p><h4>' + esc(r.title) + "</h4>" + bodyHtml(r.body)
            + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-review-resolve="' + r.id + '">Resolve</button><button type="button" class="btn btn-outline" data-review-dismiss="' + r.id + '">Dismiss</button></div></article>';
        });
        html += "</div></section>";
        html += '<section aria-label="Image library" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Image Library</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">Every uploaded image is kept here, so it can be reused on another article instead of being uploaded twice. An image that is not used anywhere can be deleted. Players see a saved image as soon as it is placed.</p>'
          + '<div class="lib-grid" style="margin-top:0.75rem">';
        CONTENT_IMAGES.forEach(function (im) {
          html += '<div class="lib-cell"><img src="' + esc(im.image_url) + '" alt="" loading="lazy" decoding="async"><span>' + esc(im.filename) + "</span>" + (im.used_in ? '<span class="muted">Used in: ' + esc(im.used_in) + "</span>" : "") + '<button type="button" class="ghost-btn" data-libdel="' + im.id + '" style="margin-top:0.25rem">Delete</button></div>';
        });
        if (CONTENT_IMAGES.length === 0) html += '<p class="small muted">No images yet. Upload the first one below, or from any article\u2019s cover controls.</p>';
        html += "</div>"
          + '<label class="gm-field"><span>Upload a new library image</span><input type="file" accept="image/*" id="libUpload" class="search-input"></label>'
          + '<p class="small" id="libMsg" role="status" style="margin:0.5rem 0 0"></p></section>';
        html += '<section aria-label="Live sync status" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Live Sync Status</h3>'
          + '<p class="small" style="margin-top:0.25rem">' + esc(syncLine()) + "</p>" + tableStatusLinesHtml() + "</section>";
        var gmResetCurrentHtml = "";
        if (state.gmResetArmed && !gmPasscodeMem) {
          gmResetCurrentHtml = '<label class="gm-field"><span>Current passcode</span><input type="password" id="gmResetCurrentPw" class="search-input" autocomplete="current-password"></label>'
            + '<p class="small muted" style="margin-top:0.25rem">Enter the current passcode to confirm the reset.</p>';
        }
        html += '<section aria-label="GM passcode" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">GM Passcode</h3>'
          + '<p class="small muted" style="margin-top:0.25rem">Resetting deletes the passcode hash from the site database and signs you out, so a new passcode can be set on the sign-in view. There is no way to recover a forgotten passcode from this page.</p>'
          + (state.gmResetArmed
            ? gmResetCurrentHtml + '<div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-teal" id="gmResetYes">Yes, reset the passcode</button><button type="button" class="btn btn-outline" id="gmResetNo">Keep it</button></div>'
            : '<button type="button" class="ghost-btn" id="gmResetArm" style="margin-top:0.5rem">Reset the GM passcode</button>')
          + '<p class="small" id="gmResetMsg" role="status" style="margin:0.5rem 0 0"></p></section>';
        html += '<div style="margin-top:2rem"><button type="button" class="btn btn-outline" id="gmSignOut">GM Sign Out</button></div></div>';
        main.innerHTML = html;
        wireCards(main);
        document.getElementById("gmEditTextToggle").addEventListener("click", function () {
          state.siteEditMode = !state.siteEditMode;
          render();
        });
        function decide(id, status) {
          if (!sb) return;
          sb.from("review_items").update({ status: status }, { returning: "minimal" }).eq("id", id).then(function (res) {
            if (res.error) return;
            GM.review = GM.review.filter(function (r) { return r.id !== id; });
            render();
          });
        }
        var res = main.querySelectorAll("[data-review-resolve]");
        for (var i = 0; i < res.length; i++) res[i].addEventListener("click", function () { decide(Number(this.getAttribute("data-review-resolve")), "accepted"); });
        var dis = main.querySelectorAll("[data-review-dismiss]");
        for (var j = 0; j < dis.length; j++) dis[j].addEventListener("click", function () { decide(Number(this.getAttribute("data-review-dismiss")), "dismissed"); });
        var dels = main.querySelectorAll("[data-libdel]");
        for (var k = 0; k < dels.length; k++) dels[k].addEventListener("click", function () {
          var id = Number(this.getAttribute("data-libdel"));
          var row = null; CONTENT_IMAGES.forEach(function (im) { if (im.id === id) row = im; });
          var msg = document.getElementById("libMsg");
          var used = false;
          visibleLore().forEach(function (e) { if (e.coverImageId === id) used = true; });
          visiblePeople().forEach(function (p) { if (p.coverImageId === id) used = true; });
          FIGURES.forEach(function (f) { if (f.imageUrl && row && f.imageUrl === row.image_url) used = true; });
          if (used) { if (msg) msg.textContent = "That image is in use, so it stays until it is removed from where it is used."; return; }
          if (!sb || !row) return;
          sb.from("content_images").delete({ returning: "minimal" }).eq("id", id).then(function (r2) {
            if (r2.error) { if (msg) msg.textContent = "The image could not be deleted."; return; }
            removeStorageObject(row.storage_path).then(function () { loadLive(); });
          });
        });
        var up = document.getElementById("libUpload");
        if (up) up.addEventListener("change", function () {
          var file = this.files && this.files[0] ? this.files[0] : null;
          var msg = document.getElementById("libMsg");
          if (!file) return;
          if (!sb) { msg.textContent = "Live sync is not connected, so the image cannot be uploaded."; return; }
          msg.textContent = "Uploading.";
          uploadToStorage(file, "covers", file.name.replace(/\.[a-z0-9]+$/i, "")).then(function (u) {
            sb.from("content_images").insert({ filename: file.name, storage_path: u.path, image_url: u.url, used_in: null }, { returning: "minimal" }).then(function (r2) {
              if (r2.error) { removeStorageObject(u.path); msg.textContent = "The library row could not be saved, so the uploaded file was removed."; return; }
              loadLive();
            }, function () { removeStorageObject(u.path); msg.textContent = "The library row could not be saved."; });
          }, function () { msg.textContent = "The upload failed, and nothing was saved."; });
        });
        var arm = document.getElementById("gmResetArm");
        if (arm) arm.addEventListener("click", function () { state.gmResetArmed = true; renderGm(main); renderFooterOnly(main); });
        var no = document.getElementById("gmResetNo");
        if (no) no.addEventListener("click", function () { state.gmResetArmed = false; renderGm(main); renderFooterOnly(main); });
        var yes = document.getElementById("gmResetYes");
        if (yes) yes.addEventListener("click", function () {
          if (!sb) return;
          function resetFailed(msg) { var m = document.getElementById("gmResetMsg"); if (m) m.textContent = msg || "The passcode could not be reset. Check the connection and try again."; }
          function doReset(oldHash) {
            sb.rpc("gm_set_passcode", { old_hash: oldHash, new_hash: null }).then(function (res) {
              if (res.error) { resetFailed(res.error.message || null); return; }
              var data = res.data;
              if (!data || data.ok !== true) { resetFailed(data && data.error ? data.error : null); return; }
              gmLock();
              GM = { chronicle: [], people: [], lore: [], secrets: [], notes: [], review: [] };
              state.gmPasscodeState = "unset"; state.gmResetArmed = false; state.gmError = "";
              state.view = "gmsignin"; state.reader = null;
              render(); window.scrollTo(0, 0);
            }, function () { resetFailed(); });
          }
          if (gmPasscodeMem) {
            sha256Hex(gmPasscodeMem).then(function (oldHash) { doReset(oldHash); }, function () { resetFailed(); });
            return;
          }
          var curInput = document.getElementById("gmResetCurrentPw");
          var cur = curInput ? curInput.value : "";
          if (!cur) { resetFailed("Enter the current passcode to reset it."); if (curInput) curInput.focus(); return; }
          sha256Hex(cur).then(function (oldHash) { doReset(oldHash); }, function () { resetFailed(); });
        });
        document.getElementById("gmSignOut").addEventListener("click", function () {
          gmLock();
          GM = { chronicle: [], people: [], lore: [], secrets: [], notes: [], review: [] };
          state.view = "wiki"; state.reader = null; render(); window.scrollTo(0, 0);
        });
        wireTextEditButtons(main);
        decorateSiteText(main);
      }

      // ---------- Mysteries ----------
      function renderMysteries(main) {
        var open = DATA.threads.filter(function (t) { return t.status === "open"; });
        var done = DATA.threads.filter(function (t) { return t.status === "resolved"; });
        var html = '<div style="margin-top:1.5rem"><h2 class="view-title" data-st="mysteries.title">' + esc(stVal("mysteries.title", "Open Threads and Mysteries")) + "</h2>" + syncNoticeHtml() + '<div class="stack" style="margin-top:1rem">';
        open.forEach(function (t) {
          html += '<article class="thread-card"><h3>' + esc(t.title) + "</h3>" + bodyHtml(t.detail) + textEditBtnHtml("thread", t.id)
            + '<div style="margin-top:0.5rem"><button type="button" class="ghost-btn" data-suggest data-suggest-section="mysteries" data-suggest-key="thread-' + t.id + '" data-suggest-label="' + esc(t.title) + '" data-suggest-type="update">Add to this thread</button> <button type="button" class="ghost-btn" data-suggest data-suggest-section="mysteries" data-suggest-key="thread-' + t.id + '" data-suggest-label="' + esc(t.title) + '" data-suggest-type="picture">Suggest art</button></div></article>';
        });
        html += "</div>";
        if (!threadsTableOk && dataLoaded) html += '<p style="margin-top:2rem;text-align:center" class="muted">Threads could not be loaded. Live sync is not connected. Try again.</p>';
        if (done.length > 0) {
          html += '<h3 class="font-display" style="margin:2rem 0 0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)" data-st="mysteries.settled">' + esc(stVal("mysteries.settled", "Settled")) + '</h3><div class="stack" style="margin-top:0.75rem">';
          done.forEach(function (t) {
            html += '<article class="thread-card settled"><h4>' + esc(t.title) + "</h4>" + bodyHtml(t.detail) + textEditBtnHtml("thread", t.id)
              + '<div style="margin-top:0.5rem"><button type="button" class="ghost-btn" data-suggest data-suggest-section="mysteries" data-suggest-key="thread-' + t.id + '" data-suggest-label="' + esc(t.title) + '" data-suggest-type="update">Suggest a change</button> <button type="button" class="ghost-btn" data-suggest data-suggest-section="mysteries" data-suggest-key="thread-' + t.id + '" data-suggest-label="' + esc(t.title) + '" data-suggest-type="picture">Suggest art</button></div></article>';
          });
          html += "</div>";
        }
        html += '<div style="margin-top:1.5rem"><button type="button" class="btn btn-teal" data-suggest data-suggest-section="mysteries" data-suggest-key="" data-suggest-label="" data-suggest-type="addition">Submit a new mystery or thread</button></div></div>';
        main.innerHTML = html;
        wireTextEditButtons(main);
        wireSuggestButtons(main);
        wireWikiLinks(main);
        decorateSiteText(main);
      }
    </script>

    <script>
      "use strict";
      // ---------- Player submissions ----------
      // Players (no passcode needed) send additions, updates, corrections,
      // and pictures to the GM. A submission is a row in review_items with
      // kind "player_submission" and status "pending": it is not live
      // content, it only reaches the GM, through the get_gm_content
      // payload, where it appears in the Player Submissions section of
      // the GM view with Resolve and Dismiss. Pictures are uploaded to
      // the same content-images storage bucket the GM tools use, in the
      // submissions folder, and their links ride inside the submission
      // text, so the GM can open, save, and place them. If live sync
      // refuses the send (or is not connected), the player is never told
      // it worked: they get the submission as text they can copy or
      // download and hand to the GM another way, pictures listed by name
      // to send alongside.
      var SUBMIT_TYPES = [
        ["addition", "Addition \u2014 something new for the site"],
        ["update", "Update or correction \u2014 something there is missing, wrong, or out of date"],
        ["picture", "Picture \u2014 artwork, a photo, or a screenshot for a page"],
        ["map", "Map \u2014 a new pin, a moved pin, or a place that is missing"],
        ["other", "Other"]
      ];
      var SUBMIT_SECTIONS = [
        ["general", "Anywhere / not sure"],
        ["wiki", "Wiki article"],
        ["people", "Person"],
        ["chronicle", "Chronicle"],
        ["timeline", "Timeline"],
        ["maps", "Map or place on a map"],
        ["mysteries", "Mystery or thread"],
        ["primer", "New Player Primer"]
      ];
      function submitTypeLabel(value) {
        for (var i = 0; i < SUBMIT_TYPES.length; i++) if (SUBMIT_TYPES[i][0] === value) return SUBMIT_TYPES[i][1];
        return value || "";
      }
      function submitSectionLabel(value) {
        for (var i = 0; i < SUBMIT_SECTIONS.length; i++) if (SUBMIT_SECTIONS[i][0] === value) return SUBMIT_SECTIONS[i][1];
        return value || "";
      }
      function submitTargetsFor(section) {
        if (section === "wiki") return visibleLore().map(function (l) { return { key: l.key, label: l.title }; });
        if (section === "people") return visiblePeople().map(function (p) { return { key: p.key, label: p.name }; });
        if (section === "chronicle") return visibleChronicle().map(function (e) { return { key: e.key, label: (e.date ? e.date + " \u2014 " : "") + e.title }; });
        if (section === "mysteries") return DATA.threads.map(function (t) { return { key: "thread-" + t.id, label: t.title }; });
        if (section === "maps") return visiblePins().map(function (p) { return { key: "pin-" + p.id, label: (MAPS[p.mapKey] ? MAPS[p.mapKey].title + ": " : "") + p.label }; });
        return [];
      }
      function submitTargetLabel(section, key, fallback) {
        var list = submitTargetsFor(section);
        for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i].label;
        return fallback || "";
      }
      function openSubmit(prefill) {
        state.submitPrefill = prefill || null;
        state.submitDone = null;
        state.view = "submit";
        state.reader = null;
        render();
        window.scrollTo(0, 0);
      }
      function wireSuggestButtons(root) {
        if (!root) return;
        var btns = root.querySelectorAll("[data-suggest]");
        for (var i = 0; i < btns.length; i++) {
          (function (btn) {
            if (btn.getAttribute("data-suggest-wired")) return;
            btn.setAttribute("data-suggest-wired", "1");
            btn.addEventListener("click", function (ev) {
              ev.preventDefault(); ev.stopPropagation();
              openSubmit({
                section: btn.getAttribute("data-suggest-section") || "general",
                key: btn.getAttribute("data-suggest-key") || "",
                label: btn.getAttribute("data-suggest-label") || "",
                type: btn.getAttribute("data-suggest-type") || "addition"
              });
            });
          })(btns[i]);
        }
      }
      function playerSubmitInsert(title, body, relatedKey) {
        if (!sb) return Promise.resolve(false);
        return sb.from("review_items").insert({ kind: "player_submission", title: title, body: body, question: title, source_note: body, status: "pending", related_key: relatedKey || null }, { returning: "minimal" }).then(function (res) { return !res.error; }, function () { return false; });
      }
      function reviewImageUrls(body) {
        var urls = [], seen = {};
        var re = /https?:\/\/[^\s<)"']+/g, m;
        var text = String(body || "");
        while ((m = re.exec(text)) !== null) {
          var u = m[0].replace(/[.,;]+$/, "");
          if ((/\.(png|jpe?g|webp|gif)(\?|#|$)/i.test(u) || u.indexOf("content-images") !== -1) && !seen[u]) { seen[u] = true; urls.push(u); }
        }
        return urls;
      }
      function reviewImagesHtml(body) {
        var urls = reviewImageUrls(body);
        if (urls.length === 0) return "";
        var html = '<div class="review-imgs">';
        urls.forEach(function (u) { html += '<a href="' + esc(u) + '" target="_blank" rel="noreferrer"><img src="' + esc(u) + '" alt="Submitted picture" loading="lazy"></a>'; });
        return html + "</div>";
      }
      // ---------- Art suggestions on pages with no image ----------
      // Every article and person page without a picture carries this
      // panel in place of the missing image: a player picks artwork
      // files right on the page, previews them, and sends them to the
      // GM's review queue (uploaded to the submissions folder, links in
      // the submission text, exactly like the Submit page). Nothing is
      // placed on the page until the GM approves it. If the send is
      // refused, the player gets the submission as copyable text plus
      // the file names, so nothing is lost.
      var artSuggestSeq = 0;
      function artSuggestHtml(section, key, label) {
        artSuggestSeq++;
        var id = "art" + artSuggestSeq;
        return '<section class="art-suggest" data-artsuggest="' + id + '" data-art-section="' + esc(section) + '" data-art-key="' + esc(key || "") + '" data-art-label="' + esc(label) + '" aria-label="Suggest art for ' + esc(label) + '">'
          + '<p class="art-suggest-kicker">No art yet</p>'
          + "<h2>Suggest art for " + esc(label) + "</h2>"
          + '<p class="small muted" style="margin:0.375rem 0 0">This page has no picture. If you have artwork, a drawing, or a screenshot that belongs here, upload it: it goes to the GM for review, and the GM places it on the page if it fits.</p>'
          + '<label class="gm-field"><span>Your name, or your character\u2019s name</span><input type="text" data-art-name class="search-input" autocomplete="name" placeholder="e.g. Paige, playing Buddy"></label>'
          + '<label class="gm-field"><span>Upload artwork (up to three pictures)</span><input type="file" data-art-files class="search-input" accept="image/*" multiple></label>'
          + '<div class="sub-previews" data-art-previews></div>'
          + '<label class="gm-field"><span>Caption or credit <span class="muted" style="font-weight:400">(optional)</span></span><input type="text" data-art-caption class="search-input" placeholder="e.g. ' + esc(label) + ', by Paige"></label>'
          + '<p class="small" data-art-msg role="status" style="margin:0.5rem 0 0"></p>'
          + '<div style="margin-top:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-art-send>Send art to the GM</button>'
          + '<button type="button" class="ghost-btn" data-art-describe>No file? Describe the art instead</button></div>'
          + '<div data-art-result></div></section>';
      }
      function wireArtSuggest(root) {
        if (!root) return;
        var panels = root.querySelectorAll("[data-artsuggest]");
        for (var i = 0; i < panels.length; i++) (function (panel) {
          if (panel.getAttribute("data-art-wired")) return;
          panel.setAttribute("data-art-wired", "1");
          var section = panel.getAttribute("data-art-section") || "general";
          var key = panel.getAttribute("data-art-key") || "";
          var label = panel.getAttribute("data-art-label") || "";
          var pending = [];
          var previews = panel.querySelector("[data-art-previews]");
          function renderPreviews() {
            if (!previews) return;
            if (pending.length === 0) { previews.innerHTML = ""; return; }
            var out = "";
            pending.forEach(function (f, idx) {
              out += '<div class="sub-preview-item"><img src="' + f.url + '" alt=""><span>' + esc(f.file.name) + '</span><button type="button" data-artremove="' + idx + '">Remove</button></div>';
            });
            previews.innerHTML = out;
            var rms = previews.querySelectorAll("[data-artremove]");
            for (var r = 0; r < rms.length; r++) rms[r].addEventListener("click", function () {
              var gone = pending.splice(Number(this.getAttribute("data-artremove")), 1)[0];
              if (gone) { try { URL.revokeObjectURL(gone.url); } catch (e) { /* already gone */ } }
              renderPreviews();
            });
          }
          var fileInput = panel.querySelector("[data-art-files]");
          if (fileInput) fileInput.addEventListener("change", function () {
            var files = this.files || [];
            for (var j = 0; j < files.length; j++) {
              if (pending.length >= 3) break;
              pending.push({ file: files[j], url: URL.createObjectURL(files[j]) });
            }
            this.value = "";
            renderPreviews();
          });
          var describeBtn = panel.querySelector("[data-art-describe]");
          if (describeBtn) describeBtn.addEventListener("click", function () {
            openSubmit({ section: section, key: key, label: label, type: "picture" });
          });
          var sendBtn = panel.querySelector("[data-art-send]");
          if (sendBtn) sendBtn.addEventListener("click", function () {
            var msg = panel.querySelector("[data-art-msg]");
            var result = panel.querySelector("[data-art-result]");
            var nameEl = panel.querySelector("[data-art-name]");
            var name = nameEl.value.trim();
            var caption = panel.querySelector("[data-art-caption]").value.trim();
            if (!name) { msg.textContent = "Add your name or your character\u2019s name, so the GM knows who sent it."; nameEl.focus(); return; }
            if (pending.length === 0) { msg.textContent = "Choose at least one picture to upload, or use \u201CDescribe the art instead\u201D."; return; }
            sendBtn.disabled = true;
            msg.textContent = "Uploading your pictures\u2026";
            result.innerHTML = "";
            var uploaded = [], failed = null, chain = Promise.resolve();
            pending.forEach(function (f) {
              chain = chain.then(function () {
                if (failed) return null;
                return uploadToStorage(f.file, "submissions", name + "-" + label).then(function (up) {
                  uploaded.push({ name: f.file.name, url: up.url });
                }, function () { failed = f.file.name; });
              });
            });
            chain.then(function () {
              var lines = [];
              lines.push("Submitted by: " + name);
              lines.push("Kind: " + submitTypeLabel("picture"));
              lines.push("Part of the site: " + submitSectionLabel(section));
              if (label) lines.push("About: " + label + (key ? " (" + key + ")" : ""));
              lines.push("");
              lines.push("Art suggested for the page \u201C" + label + "\u201D, which has no picture yet.");
              if (caption) { lines.push(""); lines.push("Picture caption: " + caption); }
              if (uploaded.length > 0) {
                lines.push("");
                lines.push("Pictures:");
                uploaded.forEach(function (u) { lines.push("- " + u.name + ": " + u.url); });
              }
              var body = lines.join("\n");
              var title = "Picture: Art for " + label + " \u2014 from " + name;
              function showFallback(reason) {
                sendBtn.disabled = false;
                msg.textContent = "";
                var packet = "Art suggestion for the Heroes of Oakrest site\n" + title + "\n\n" + body
                  + "\n\nPictures to send with this text: " + pending.map(function (f) { return f.file.name; }).join(", ");
                result.innerHTML = '<div class="sub-fallback" role="status"><p style="margin:0"><strong>It could not be sent from here.</strong></p>'
                  + '<p class="small" style="margin:0.375rem 0 0">' + esc(reason) + " Your suggestion is written out below instead: copy it or download it and hand it to the GM (in Discord, say), with the picture files themselves. Nothing was lost and nothing was posted to the site.</p>"
                  + '<label class="gm-field"><span>Your suggestion</span><textarea data-art-packet class="search-input" rows="9" readonly>' + esc(packet) + "</textarea></label>"
                  + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" data-art-copy>Copy the suggestion</button><button type="button" class="btn btn-outline" data-art-download>Download it as a file</button></div>'
                  + '<p class="small" data-art-copymsg role="status" style="margin:0.5rem 0 0"></p></div>';
                result.scrollIntoView({ block: "nearest" });
                result.querySelector("[data-art-copy]").addEventListener("click", function () {
                  var ta = result.querySelector("[data-art-packet]");
                  var cm = result.querySelector("[data-art-copymsg]");
                  function done() { cm.textContent = "Copied. Paste it wherever you reach the GM."; }
                  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); cm.textContent = "The text is selected: copy it with your keyboard."; });
                  else { ta.select(); cm.textContent = "The text is selected: copy it with your keyboard."; }
                });
                result.querySelector("[data-art-download]").addEventListener("click", function () {
                  downloadSubmissionText("oakrest-art-" + label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) + ".txt", packet);
                });
              }
              if (failed) { showFallback("The picture \u201C" + failed + "\u201D could not be uploaded, so the suggestion was not sent half-finished."); return; }
              msg.textContent = "Sending\u2026";
              playerSubmitInsert(title, body, key || section).then(function (ok) {
                if (!ok) { showFallback("Live sync refused the send, or is not connected right now."); return; }
                panel.innerHTML = '<div class="art-done" role="status"><p style="margin:0"><strong>Art sent to the GM.</strong></p>'
                  + '<p class="small" style="margin:0.375rem 0 0">Art for \u201C' + esc(label) + "\u201D from " + esc(name) + " is in the review queue, with " + uploaded.length + (uploaded.length === 1 ? " picture" : " pictures") + ". It will appear on this page once the GM has approved it and placed it.</p></div>";
              });
            });
          });
        })(panels[i]);
      }
      function downloadSubmissionText(filename, text) {
        var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      }
      function renderSubmit(main) {
        var prefill = state.submitPrefill || {};
        var startSection = prefill.section || "general";
        var startType = prefill.type || "addition";
        var html = '<div style="margin-top:1.5rem"><h2 class="view-title" data-st="submit.title">' + esc(siteText("submit.title")) + "</h2>"
          + '<p class="small muted" style="margin-top:0.25rem" data-st="submit.intro">' + esc(siteText("submit.intro")) + "</p>"
          + syncNoticeHtml();
        if (state.submitDone) {
          var d = state.submitDone;
          html += '<div class="sub-success" role="status"><p style="margin:0"><strong>Sent to the GM.</strong></p>'
            + '<p class="small" style="margin:0.375rem 0 0">\u201C' + esc(d.subject) + "\u201D is in the review queue"
            + (d.images > 0 ? ", with " + d.images + (d.images === 1 ? " picture" : " pictures") : "")
            + ". It will appear on the site once the GM has approved it and placed it.</p>"
            + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" id="subAnother">Submit another</button><button type="button" class="btn btn-outline" id="subGoWiki">Back to the Wiki</button></div></div>';
        }
        html += '<form id="subForm" style="margin-top:1.25rem" novalidate>'
          + '<section style="border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1rem">'
          + '<h3 class="font-display" style="margin:0;font-size:1.125rem;font-weight:600">What are you sending?</h3>'
          + (prefill.label ? '<p style="margin:0.625rem 0 0"><span class="sub-about">About: ' + esc(prefill.label) + ' <button type="button" id="subClearAbout">Clear</button></span></p>' : "")
          + '<label class="gm-field"><span>Your name, or your character\u2019s name</span><input type="text" id="subName" class="search-input" autocomplete="name" placeholder="e.g. Paige, playing Buddy"></label>'
          + '<label class="gm-field"><span>Kind of submission</span><select id="subType" class="search-input">'
          + SUBMIT_TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (startType === t[0] ? " selected" : "") + ">" + esc(t[1]) + "</option>"; }).join("")
          + "</select></label>"
          + '<label class="gm-field"><span>Which part of the site?</span><select id="subSection" class="search-input">'
          + SUBMIT_SECTIONS.map(function (s) { return '<option value="' + s[0] + '"' + (startSection === s[0] ? " selected" : "") + ">" + esc(s[1]) + "</option>"; }).join("")
          + "</select></label>"
          + '<label class="gm-field"><span>Which entry is it about? <span class="muted" style="font-weight:400">(if one)</span></span><select id="subRelated" class="search-input"></select></label>'
          + '<label class="gm-field"><span>Subject</span><input type="text" id="subSubject" class="search-input" placeholder="e.g. Buddy\u2019s portrait, or: the Squatting Duck has a cellar"></label>'
          + '<label class="gm-field"><span>The details</span><textarea id="subDetails" class="search-input" rows="9" placeholder="For an addition: the new text, as it should read. For an update: what is there now, and what it should say instead. For a picture: what it shows and where it belongs."></textarea></label>'
          + "</section>"
          + '<section style="border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1rem;margin-top:0.75rem">'
          + '<h3 class="font-display" style="margin:0;font-size:1.125rem;font-weight:600">Pictures</h3>'
          + '<p class="small muted" style="margin:0.25rem 0 0">Attach up to four pictures: character art, a screenshot, a map sketch, a photo of your notes. They are sent with the submission for the GM to place.</p>'
          + '<label class="gm-field"><span>Add pictures</span><input type="file" id="subFiles" class="search-input" accept="image/*" multiple></label>'
          + '<div class="sub-previews" id="subPreviews"></div>'

          + "</form>";
        if (state.mySubmissions && state.mySubmissions.length > 0) {
          html += '<section aria-label="Your submissions this session" style="margin-top:2rem"><h3 class="font-display" style="margin:0;font-size:1.25rem;font-weight:600;color:var(--accent-deep)">Your submissions this sitting</h3><div class="stack" style="margin-top:0.75rem">';

        var pendingFiles = [];
        var relatedSel = document.getElementById("subRelated");
        var sectionSel = document.getElementById("subSection");
        function relatedOptionsHtml(section, selectedKey) {
          var list = submitTargetsFor(section);

          var found = false;
          list.forEach(function (t) {
            if (t.key === selectedKey) found = true;

        }

          relatedSel.innerHTML = relatedOptionsHtml(this.value, "");

        var previews = document.getElementById("subPreviews");

          });

        document.getElementById("subForm").addEventListener("submit", function (ev) {
          ev.preventDefault();

          var result = document.getElementById("subResult");
          var sendBtn = document.getElementById("subSend");
          var name = document.getElementById("subName").value.trim();
          var type = document.getElementById("subType").value;
          var section = sectionSel.value;
          var relatedKey = relatedSel.value || "";
          var relatedLabel = relatedKey ? submitTargetLabel(section, relatedKey, (state.submitPrefill && state.submitPrefill.key === relatedKey) ? state.submitPrefill.label : relatedKey) : "";
          var subject = document.getElementById("subSubject").value.trim();
          var details = document.getElementById("subDetails").value.trim();
          var caption = document.getElementById("subCaption").value.trim();
          result.innerHTML = "";
          if (!name) { msg.textContent = "Add your name or your character\u2019s name, so the GM knows who sent it."; document.getElementById("subName").focus(); return; }
          if (!subject) { msg.textContent = "Give the submission a subject."; document.getElementById("subSubject").focus(); return; }
          if (!details && pendingFiles.length === 0) { msg.textContent = "Write the details, or attach a picture: the GM needs something to work from."; document.getElementById("subDetails").focus(); return; }
          sendBtn.disabled = true;
          msg.textContent = pendingFiles.length > 0 ? "Uploading your pictures\u2026" : "Sending\u2026";
          var uploaded = [];
          var uploadFailed = null;
          var chain = Promise.resolve();
          pendingFiles.forEach(function (f) {
            chain = chain.then(function () {
              if (uploadFailed) return null;
              return uploadToStorage(f.file, "submissions", name + "-" + subject).then(function (up) {
                uploaded.push({ name: f.file.name, url: up.url });

            });
          });
          chain.then(function () {
            var lines = [];
            lines.push("Submitted by: " + name);
            lines.push("Kind: " + submitTypeLabel(type));
            lines.push("Part of the site: " + submitSectionLabel(section));
            if (relatedLabel) lines.push("About: " + relatedLabel + (relatedKey ? " (" + relatedKey + ")" : ""));
            lines.push("");
            lines.push(details || "(No written details \u2014 picture submission.)");
            if (caption) { lines.push(""); lines.push("Picture caption: " + caption); }
            if (uploaded.length > 0) {
              lines.push("");
              lines.push("Pictures:");
              uploaded.forEach(function (u) { lines.push("- " + u.name + ": " + u.url); });
            }
            var body = lines.join("\n");
            var title = submitTypeLabel(type).split(" \u2014")[0] + ": " + subject + " \u2014 from " + name;
            function showFallback(reason) {
              sendBtn.disabled = false;
              msg.textContent = "";
              var packet = "Submission for the Heroes of Oakrest site\n" + title + "\n\n" + body;
              if (pendingFiles.length > 0 && uploaded.length < pendingFiles.length) {
                packet += "\n\nPictures to send with this text: " + pendingFiles.map(function (f) { return f.file.name; }).join(", ");
              }
              state.mySubmissions.unshift({ subject: subject, type: submitTypeLabel(type), status: "copy", images: pendingFiles.length, when: new Date().toLocaleString() });
              result.innerHTML = '<div class="sub-fallback" role="status"><p style="margin:0"><strong>It could not be sent from here.</strong></p>'
                + '<p class="small" style="margin:0.375rem 0 0">' + esc(reason) + " Your submission is written out below instead: copy it or download it and hand it to the GM (in Discord, say), with the picture files themselves if you attached any. Nothing was lost and nothing was posted to the site.</p>"
                + '<label class="gm-field"><span>Your submission</span><textarea id="subPacket" class="search-input" rows="10" readonly>' + esc(packet) + "</textarea></label>"
                + '<div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.5rem"><button type="button" class="btn btn-deep" id="subCopy">Copy the submission</button><button type="button" class="btn btn-outline" id="subDownload">Download it as a file</button></div>'
                + '<p class="small" id="subCopyMsg" role="status" style="margin:0.5rem 0 0"></p></div>';
              result.scrollIntoView({ block: "nearest" });
              document.getElementById("subCopy").addEventListener("click", function () {
                var ta = document.getElementById("subPacket");
                var cm = document.getElementById("subCopyMsg");
                function done() { cm.textContent = "Copied. Paste it wherever you reach the GM."; }
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); cm.textContent = "The text is selected: copy it with your keyboard."; });
                else { ta.select(); cm.textContent = "The text is selected: copy it with your keyboard."; }
              });
              document.getElementById("subDownload").addEventListener("click", function () {
                downloadSubmissionText("oakrest-submission-" + subject.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) + ".txt", packet);
              });
            }
            if (uploadFailed) { showFallback("The picture \u201C" + uploadFailed + "\u201D could not be uploaded, so the submission was not sent half-finished."); return; }
            msg.textContent = "Sending\u2026";
            playerSubmitInsert(title, body, relatedKey || section).then(function (ok) {
              if (!ok) { showFallback("Live sync refused the send, or is not connected right now."); return; }
              state.mySubmissions.unshift({ subject: subject, type: submitTypeLabel(type), status: "sent", images: uploaded.length, when: new Date().toLocaleString() });
              state.submitDone = { subject: subject, images: uploaded.length };
              state.submitPrefill = null;
              render();
              window.scrollTo(0, 0);
            });
          });
        });
        decorateSiteText(main);
      }
    </script>

    <script>
      "use strict";
      // ---------- Interactive map stage ----------
      // Pan (drag / arrow keys), zoom (mouse wheel, zoom bar, slider,
      // plus/minus buttons, pinch, double-tap, keyboard).
      function compassRoseSvg() {
        return '<svg viewBox="0 0 100 100" aria-hidden="true">'
          + '<circle cx="50" cy="50" r="47" fill="#fbf7ec" fill-opacity="0.88" stroke="#221d13" stroke-width="2"/>'
          + '<circle cx="50" cy="50" r="40" fill="none" stroke="#221d13" stroke-width="1"/>'
          + '<polygon points="50,17 54.5,45.5 83,50 54.5,54.5 50,83 45.5,54.5 17,50 45.5,45.5" fill="#221d13"/>'
          + '<polygon points="50,27 53,47 73,50 53,53 50,73 47,53 27,50 47,47" fill="#b8862b" transform="rotate(45 50 50)"/>'
          + '<circle cx="50" cy="50" r="4.5" fill="#fbf7ec" stroke="#221d13" stroke-width="1.5"/>'
          + '<text x="50" y="13.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#221d13" font-family="Georgia, serif">N</text>'
          + "</svg>";
      }
      function createStage(frame, mapDef, pins, opts) {
        var inner = frame.querySelector("[data-map-inner]");
        var img = frame.querySelector("[data-map-img]");
        var slider = frame.querySelector("[data-zoom-slider]");
        var pct = frame.querySelector("[data-zoom-pct]");
        var vpEl = frame.querySelector("[data-vp]");
        var scale = 1, tx = 0, ty = 0, aspect = (mapDef && mapDef.aspect) || 0.77;
        var pointers = new Map();
        var panStart = null, pinchStart = null;
        var lastTap = { t: 0, x: 0, y: 0 };
        var pinEls = {};
        // While an item drag is in flight, buildPins must not rebuild the
        // pin layer: rebuilding replaces the very element being dragged,
        // the drag then moves a detached node, and the pin vanishes from
        // the map until the pointer is released. Rebuilds queue instead
        // and run when the drag ends.
        var dragActive = false, rebuildQueued = false;
        // Set by any deliberate view change (zoom, pan, jump to a point).
        // The image load handler re-fits with the true aspect only while
        // this is still false, so a slow-loading map never snaps the view
        // away from where the reader has already taken it.
        var userMoved = false;

        function frameSize() { return { w: frame.clientWidth || 0, h: frame.clientHeight || 0 }; }
        function clampView(s, x, y) {
          var fs = frameSize();
          var mw = fs.w * s, mh = fs.w * aspect * s;
          var minX = Math.min(0, fs.w - mw), minY = Math.min(0, fs.h - mh);
          return { s: s, x: Math.max(minX - 40, Math.min(40, x)), y: Math.max(minY - 40, Math.min(40, y)) };
        }
        function applyElTransform(el) {
          var bottom = el.getAttribute("data-anchor") === "bottom";
          var anch = bottom ? "translate(-50%,-100%)" : "translate(-50%,-50%)";
          var sf = Number(el.getAttribute("data-size")) || 1;
          // Scale around the anchor point itself. With the default centre
          // origin, a bottom-anchored pin's tip landed (sf/scale - 1) *
          // height / 2 below its stored position whenever the zoom was not
          // exactly the pin's size factor, so the visible pin sat below
          // the point a drag was moving and resizing grew it from its
          // middle instead of its tip.
          el.style.transformOrigin = bottom ? "50% 100%" : "50% 50%";
          el.style.transform = anch + " scale(" + (sf / scale) + ")";
        }
        function applyView(s, x, y) {
          var c = clampView(s, x, y);
          scale = c.s; tx = c.x; ty = c.y;
          if (opts.mapKey && state.mapViews) state.mapViews[opts.mapKey] = { s: scale, x: tx, y: ty };
          inner.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + scale + ")";
          for (var id in pinEls) applyElTransform(pinEls[id]);
          slider.value = Math.round(scale * 100);
          pct.textContent = Math.round(scale * 100) + "%";
          var fs = frameSize();
          if (vpEl && fs.w > 0) {
            var left = Math.max(0, Math.min(100, (-tx / (fs.w * scale)) * 100));
            var top = Math.max(0, Math.min(100, (-ty / (fs.w * aspect * scale)) * 100));
            var wdt = Math.min(100, 100 / scale);
            var hgt = Math.min(100, (fs.h / (fs.w * aspect * scale)) * 100);
            vpEl.style.left = left + "%"; vpEl.style.top = top + "%";
            vpEl.style.width = wdt + "%"; vpEl.style.height = hgt + "%";
          }
        }
        function fit() {
          var fs = frameSize();
          var s = Math.min(1, fs.h / Math.max(1, fs.w * aspect));
          applyView(s, (fs.w - fs.w * s) / 2, (fs.h - fs.w * aspect * s) / 2);
        }
        function zoomAt(cx, cy, factor) {
          userMoved = true;
          var ns = Math.min(6, Math.max(0.4, scale * factor));
          var k = ns / scale;
          applyView(ns, cx - (cx - tx) * k, cy - (cy - ty) * k);
        }
        function zoomToPoint(px, py, s) {
          userMoved = true;
          s = s || 2.4;
          var fs = frameSize();
          applyView(s, fs.w / 2 - (px / 100) * fs.w * s, fs.h / 2 - (py / 100) * fs.w * aspect * s);
        }

        var lastDrag = { key: null, t: 0 };
        function toMapCoords(clientX, clientY) {
          var rect = frame.getBoundingClientRect();
          var fs = frameSize();
          var px = ((clientX - rect.left - tx) / scale) / Math.max(1, fs.w) * 100;
          var py = ((clientY - rect.top - ty) / scale) / Math.max(1, fs.w * aspect) * 100;
          return { x: Math.round(Math.max(0, Math.min(100, px)) * 100) / 100, y: Math.round(Math.max(0, Math.min(100, py)) * 100) / 100 };
        }
        function dragSuppressed(key) { return lastDrag.key === key && Date.now() - lastDrag.t < 400; }
        // One unified press handler per map item: tap selects, a press held
        // still opens the item menu, and a press that moves drags the item.
        // Keeping all three in a single pointerdown registration matters:
        // separate competing registrations (an earlier long-press timer plus
        // a separate drag listener) and the browser's native image drag on
        // the <img> inside image pins were cancelling each other out, which
        // is why dragging pins did not work.
        function attachPressDrag(el, wrap, key, handlers) {
          el.addEventListener("pointerdown", function (ev) {
            if (ev.pointerType === "mouse" && ev.button !== 0) return;
            ev.stopPropagation();
            var pid = ev.pointerId;
            var startX = ev.clientX, startY = ev.clientY;
            // Where on the item the press landed, kept as the distance
            // from the pointer to the item's anchor point in map
            // coordinates. A drag preserves this offset, so the item stays
            // under the exact spot that was grabbed. Without it the anchor
            // snapped to the pointer on the first move: for a numbered pin
            // the anchor is its tip, far below the diamond head a reader
            // actually grabs, so the pin felt gripped from way below.
            var grabDX = 0, grabDY = 0;
            if (wrap && handlers.canDrag) {
              var pressPt = toMapCoords(startX, startY);
              var anchorX = parseFloat(wrap.style.left), anchorY = parseFloat(wrap.style.top);
              if (isFinite(anchorX) && isFinite(anchorY)) { grabDX = anchorX - pressPt.x; grabDY = anchorY - pressPt.y; }
            }
            var pos = null, moved = false, longFired = false;
            var timer = null;
            if (handlers.onLongPress) {
              timer = setTimeout(function () {
                longFired = true;
                lastDrag = { key: key, t: Date.now() };
                cleanup();
                handlers.onLongPress(startX, startY);
              }, 600);
            }
            function mv(e) {
              if (e.pointerId !== pid) return;
              if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) < 6) return;
              if (!moved) {
                moved = true;
                if (timer) { clearTimeout(timer); timer = null; }
                if (handlers.canDrag) { dragActive = true; if (wrap) wrap.classList.add("is-dragging"); }
              }
              if (e.cancelable) e.preventDefault();
              var rawPt = toMapCoords(e.clientX, e.clientY);
              var pt = {
                x: Math.round(Math.max(0, Math.min(100, rawPt.x + grabDX)) * 100) / 100,
                y: Math.round(Math.max(0, Math.min(100, rawPt.y + grabDY)) * 100) / 100
              };
              pos = pt;
              if (wrap && handlers.canDrag) { wrap.style.left = pt.x + "%"; wrap.style.top = pt.y + "%"; }
            }
            function cleanup() {
              if (timer) { clearTimeout(timer); timer = null; }
              window.removeEventListener("pointermove", mv, true);
              window.removeEventListener("pointerup", up, true);
              window.removeEventListener("pointercancel", up, true);
            }
            function up(e) {
              if (e.pointerId !== pid) return;
              var wasMoved = moved, finalPos = pos;
              cleanup();
              if (wrap) wrap.classList.remove("is-dragging");
              dragActive = false;
              if (longFired) return;
              if (wasMoved && finalPos && handlers.canDrag && handlers.onDragDone) {
                lastDrag = { key: key, t: Date.now() };
                handlers.onDragDone(finalPos.x, finalPos.y);
              }
              if (rebuildQueued) { rebuildQueued = false; buildPins(); }
            }
            window.addEventListener("pointermove", mv, true);
            window.addEventListener("pointerup", up, true);
            window.addEventListener("pointercancel", up, true);
          });
          el.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (dragSuppressed(key)) return;
            if (handlers.onTap) handlers.onTap();
          });
          el.addEventListener("contextmenu", function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            if (handlers.onContext) handlers.onContext(ev.clientX, ev.clientY);
          });
        }

        function buildPins() {
          if (dragActive) { rebuildQueued = true; return; }
          var layer = frame.querySelector("[data-pin-layer]");
          var html = "";
          pins.forEach(function (p, i) {
            var art = p.iconKey ? iconSrc(p.iconKey) : null;
            var isSel = opts.getSelectedId() === p.id;
            var labelOn = opts.getShowLabels() && p.showLabel && (p.label || "").trim().length > 0;
            var sz = itemSize("pin", p.id);
            var pLocked = opts.isItemLocked ? opts.isItemLocked("pin", p.id) : false;
            var pHidden = p.visibility === "gm";
            var pBadges = (pLocked ? '<span class="pin-lock" aria-hidden="true">&#128274;</span>' : "") + (pHidden ? '<span class="pin-hidden-tag">Hidden</span>' : "");
            var pStateCls = (pLocked ? " is-locked" : "") + (pHidden ? " is-hidden" : "") + ((opts.canDragPins && !pLocked) ? " draggable" : "");
            var pDropKey = "pin-" + p.id;
            var pDrop = DROP_SEEN[pDropKey] ? "" : " drop-in";
            DROP_SEEN[pDropKey] = true;
            if (art) {
              html += '<div class="pin-wrap' + (isSel ? " selected" : "") + '" data-pinwrap="' + p.id + '" data-size="' + sz + '" style="left:' + p.x + "%;top:" + p.y + '%">'
                + '<button type="button" class="map-pin art' + (isSel ? " selected" : "") + pStateCls + pDrop + '" data-pin="' + p.id + '" aria-label="Pin ' + p.number + ": " + esc(p.label) + (pLocked ? " (locked)" : "") + (pHidden ? " (hidden from players)" : "") + '"' + (pDrop ? ' style="animation-delay:' + Math.min(i * 60, 600) + "ms, " + (i * 130) + 'ms"' : "") + '>'
                + '<img src="' + art + '" alt="" draggable="false">' + '<span class="badge">' + p.number + "</span>" + pBadges
                + "</button>"
                + (labelOn ? '<span class="map-label' + (p.x > 76 ? " flip" : "") + '">' + esc(p.label) + "</span>" : "")
                + "</div>";
            } else {
              var pending = p.status === "pending";
              html += '<div class="pin-wrap' + (isSel ? " selected" : "") + '" data-pinwrap="' + p.id + '" data-anchor="bottom" data-size="' + sz + '" style="left:' + p.x + "%;top:" + p.y + '%">'
                + '<button type="button" class="map-pin diamond' + (isSel ? " selected" : "") + (pending ? " pending" : "") + pStateCls + pDrop + '" data-pin="' + p.id + '" aria-label="Pin ' + p.number + ": " + esc(p.label) + (pending ? " (awaiting GM approval)" : "") + (pLocked ? " (locked)" : "") + (pHidden ? " (hidden from players)" : "") + '"' + (pDrop ? ' style="animation-delay:' + (i * 130) + 'ms"' : "") + '>'
                + '<span class="pin-top"><span class="pin-ring"></span><span class="pin-head"><span class="pin-num">' + p.number + "</span></span></span>"
                + '<span class="pin-stem"></span>' + pBadges
                + (labelOn ? '<span class="pin-tip">' + esc(p.label) + "</span>" : "")
                + "</button></div>";
            }
          });
          var markers = opts.getMarkers ? opts.getMarkers() : [];
          markers.forEach(function (m) {
            var effIcon = m.iconKey || (m.kind === "party" ? "party-token" : null);
            var art = effIcon ? iconSrc(effIcon) : null;
            var isSel = opts.getSelectedMarkerId && opts.getSelectedMarkerId() === m.id;
            var labelOn = opts.getShowLabels() && m.showLabel && (m.label || "").trim().length > 0;
            var name = m.kind === "party" ? (m.label || "The Party") : (m.label || "Marker");
            var mLocked = opts.isItemLocked ? opts.isItemLocked("marker", m.id) : false;
            var mHidden = m.visibility === "gm";
            var mBadges = (mLocked ? '<span class="pin-lock" aria-hidden="true">&#128274;</span>' : "") + (mHidden ? '<span class="pin-hidden-tag">Hidden</span>' : "");
            var mStateCls = (mLocked ? " is-locked" : "") + (mHidden ? " is-hidden" : "") + ((opts.canDragMarkers && !mLocked) ? " draggable" : "");
            var mDropKey = "marker-" + m.id;
            var mDrop = DROP_SEEN[mDropKey] ? "" : " drop-in";
            DROP_SEEN[mDropKey] = true;

          var op = existing ? sb.from("map_markers").update(row, { returning: "minimal" }).eq("id", existing.id) : sb.from("map_markers").insert(row, { returning: "minimal" });

        });

        menu.style.top = Math.max(4, Math.min(clientY, window.innerHeight - mh - 8)) + "px";
        var btns = menu.querySelectorAll("[data-ctx]");
        for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", function () {
          var it = items[Number(this.getAttribute("data-ctx"))];

            var q = this.value.trim().toLowerCase();

            for (var a = 0; a < all.length; a++) {
              var b = all[a];

              b.style.display = show ? "" : "none";

            for (var g = 0; g < groups.length; g++) {
              var grp = groups[g], vis = !q, sib = grp.nextElementSibling;
              while (sib && !sib.hasAttribute("data-group")) {
                if (sib.hasAttribute("data-ctx") && sib.style.display !== "none") { vis = true; break; }
                sib = sib.nextElementSibling;
              }
              grp.style.display = vis ? "" : "none";

          });
        } else {
          var first = menu.querySelector("[data-ctx]:not([disabled])");
          if (first) first.focus();
        }
        function onDocDown(ev) { if (!menu.contains(ev.target)) { closeMapCtx(); document.removeEventListener("pointerdown", onDocDown, true); } }
        document.addEventListener("pointerdown", onDocDown, true);
        menu.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeMapCtx(); });

      // In-place refresh: rebuilds only the pin layer, the pin/marker
      // panels, and the pin list's Locked/Hidden tags. The stage itself
      // (and its zoom/pan) is left untouched, so using it for lock and
      // unlock never zooms the map back out the way a full render() did:
      // render() recreates the stage, and a new stage always starts
      // fitted. If there is no live stage, fall back to a render that
      // preserves the saved view for this map.
      function refreshMapView() {
        if (stage) stage.refreshPins();
        var panel = document.getElementById("pinPanel");
        var mPanel = document.getElementById("markerPanel");
        if (panel) renderPinPanel(panel);
        if (mPanel) renderMarkerPanel(mPanel);
        var listBtns = document.querySelectorAll("[data-pinlist]");
        for (var i = 0; i < listBtns.length; i++) {
          (function (btn) {
            var pid = Number(btn.getAttribute("data-pinlist"));
            var pin = null;
            for (var j = 0; j < DATA.pins.length; j++) if (DATA.pins[j].id === pid) pin = DATA.pins[j];
            if (!pin) return;
            btn.innerHTML = '<span class="num">' + pin.number + '.</span> <span style="font-weight:500">' + esc(pin.label) + "</span>"
              + (pin.visibility === "gm" ? ' <span class="hidden-tag">Hidden</span>' : "")
              + (gmIsUnlocked() && isLocked("pin", pin.id) ? ' <span class="hidden-tag" style="background:#3a3e2e;border:1px solid #5a5e4a">Locked</span>' : "")
              + (pin.note ? '<span class="note">' + esc(pin.note) + "</span>" : "");
          })(listBtns[i]);
        }
      }
      function renderPreservingMapView() {

        render();

      function toggleItemLock(kind, id) {

        setLocked(kind, id, now).then(function (ok) {
          setMapMsg(ok ? (now ? "Locked. It cannot be dragged or deleted until it is unlocked." : "Unlocked. It can be dragged again.") : "The lock change could not be saved.");
          if (stage) refreshMapView(); else renderPreservingMapView();
        });
      }
      function toggleItemHidden(kind, id) {
        var item = mapItemByKind(kind, id);

        var hide = item.visibility !== "gm";
        var table = kind === "pin" ? "map_pins" : "map_markers";
        sb.from(table).update({ visibility: hide ? "gm" : "player" }, { returning: "minimal" }).eq("id", id).then(function (res) {
          if (res.error) { setMapMsg("The visibility change could not be saved."); return; }
          item.visibility = hide ? "gm" : "player";

      function deleteMapItem(kind, id) {
        var item = mapItemByKind(kind, id);
        if (!item || !sb) return;
        if (isLocked(kind, id)) { setMapMsg("That item is locked. Unlock it before deleting it."); return; }
        var table = kind === "pin" ? "map_pins" : "map_markers";
        sb.from(table).delete({ returning: "minimal" }).eq("id", id).then(function (res) {
          if (res.error) { setMapMsg("That item could not be deleted."); return; }
          if (kind === "pin") DATA.pins = DATA.pins.filter(function (p) { return p.id !== id; });
          else MARKERS = MARKERS.filter(function (m) { return m.id !== id; });
          delete MAP_EXTRAS.sizes[kind + "-" + id];
          delete MAP_EXTRAS.locks[kind + "-" + id];
          if (kind === "marker") delete MAP_EXTRAS.links["marker-" + id];
          saveExtras("sizes"); saveExtras("locks");

          if (state.selectedPinId === id) state.selectedPinId = null;
          if (state.selectedMarkerId === id) state.selectedMarkerId = null;
