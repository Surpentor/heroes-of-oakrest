          return;
        }
        var pins = visiblePins().filter(function (p) { return p.mapKey === state.mapKey; });
        var markersHere = visibleMarkers(state.mapKey);
        var crumbs = [];
        var k = state.mapKey, seen = {};
        while (k && MAPS[k] && !seen[k]) { seen[k] = true; crumbs.unshift({ key: k, title: MAPS[k].title }); k = MAPS[k].parentKey; }

        var html = '<div style="margin-top:1.5rem"><h2 class="view-title">Maps of Caldaryn</h2>'
          + '<p class="small muted" style="margin-top:0.25rem" data-st="maps.intro">' + esc(siteText("maps.intro")) + "</p>";
        if (crumbs.length > 1) {
          html += '<nav class="crumbs" aria-label="Map breadcrumb">';
          crumbs.forEach(function (c, i) {
            if (i > 0) html += '<span aria-hidden="true" class="muted">\u203A</span>';
            if (i === crumbs.length - 1) html += '<span style="font-weight:600" aria-current="page">' + esc(c.title) + "</span>";
            else html += '<button type="button" data-crumb="' + c.key + '">' + esc(c.title) + "</button>";
          });
          html += '<button type="button" class="back" id="crumbBack">Back</button></nav>';
        }
        html += '<div class="chiprow" style="margin-top:0.75rem" role="group" aria-label="Choose a map">';
        Object.keys(MAPS).forEach(function (mk) {
          html += '<button type="button" class="chip" data-mapchip="' + mk + '" aria-pressed="' + (state.mapKey === mk) + '">' + esc(MAPS[mk].title) + "</button>";
        });
        html += "</div>";
        html += '<div class="chiprow" style="margin-top:0.75rem">'
          + '<button type="button" class="ghost-btn" id="togglePins" aria-pressed="' + state.showPins + '">' + (state.showPins ? "Hide pins" : "Show pins") + "</button>"
          + '<button type="button" class="ghost-btn" id="toggleLabels" aria-pressed="' + state.showLabels + '">' + (state.showLabels ? "Hide labels" : "Show labels") + "</button>"
          + "</div>";
        if (gmIsUnlocked()) {
          html += '<p class="small muted" style="margin-top:0.5rem">GM editing: drag an icon from the library below onto the map, tap an icon then tap the map, or right-click the map (long-press on touch) and pick an icon from the picture list. Drag any unlocked pin or marker to move it. Right-click any item to rename it, change its icon, lock or unlock it, hide or reveal it, duplicate, or delete it. With an item selected, Delete removes it (locked items must be unlocked first). Items marked <span class="hidden-tag" style="display:inline-block;border-radius:999px;background:var(--danger);color:#fff;padding:0 0.45rem;font-size:0.7rem;font-weight:700;text-transform:uppercase">Hidden</span> are visible only to you.</p>'
            + '<p class="map-status" id="mapStatus" role="status">' + esc(state.mapMsg || "") + "</p>"
            + iconLibraryHtml();
        }
        html += '<div style="margin-top:0.75rem">'
          + '<div class="map-frame" id="mapFrame" role="application" tabindex="0" aria-label="Interactive map: ' + esc(mapDef.title) + '. Drag to pan, use the mouse wheel, zoom bar or pinch to zoom, arrow keys pan, plus and minus zoom.">'
          + '<div class="map-inner" data-map-inner>'
          + '<img data-map-img src="' + esc(mapDef.img) + '" alt="' + esc(mapDef.alt) + '" draggable="false">'
          + "<div data-pin-layer></div>"
          + "</div>"
          + '<div class="map-controls" data-controls>'
          + '<button type="button" class="ctrl-btn" data-zoom-in aria-label="Zoom in">+</button>'
          + '<button type="button" class="ctrl-btn" data-zoom-out aria-label="Zoom out">\u2212</button>'
          + '<button type="button" class="ctrl-btn fit" data-fit aria-label="Fit map to screen">Fit</button>'
          + "</div>"
          + '<div class="zoombar" data-controls><label style="display:flex;flex:1;align-items:center"><span class="sr-only">Zoom level</span>'
          + '<input type="range" min="40" max="600" value="100" data-zoom-slider aria-label="Zoom level slider"></label>'
          + '<span class="pct" data-zoom-pct>100%</span></div>'
          + '<div class="minimap" aria-hidden="true"><div class="rel"><img src="' + esc(mapDef.img) + '" alt=""><span class="vp" data-vp></span></div></div>'
          + "</div></div>"
          + '<div id="pinPanel"></div>'
          + '<div id="markerPanel"></div>'
          + '<section aria-label="Pin list" style="margin-top:1rem"><h3 class="font-display" style="font-size:1.125rem;font-weight:600;margin:0">Pins on ' + esc(mapDef.title) + "</h3>"
          + '<ol class="pin-list">';
        pins.forEach(function (p) {
          html += '<li><button type="button" data-pinlist="' + p.id + '"><span class="num">' + p.number + '.</span> <span style="font-weight:500">' + esc(p.label) + "</span>"
            + (p.visibility === "gm" ? ' <span class="hidden-tag">Hidden</span>' : "")
            + (isLocked("pin", p.id) ? ' <span class="hidden-tag" style="background:#3a3e2e;border:1px solid #5a5e4a">Locked</span>' : "")
            + (p.note ? '<span class="note">' + esc(p.note) + "</span>" : "") + "</button></li>";
        });
        if (pins.length === 0) html += '<li class="small muted">No pins on this map yet.</li>';
        html += "</ol></section>";
        if (gmIsUnlocked()) html += mapToolsHtml();
        html += "</div>";

        main.innerHTML = html;

        var panel = document.getElementById("pinPanel");
        var mPanel = document.getElementById("markerPanel");
        var stagePins = state.showPins ? pins : [];
        stage = createStage(document.getElementById("mapFrame"), mapDef, stagePins, {
          mapKey: state.mapKey,
          getSelectedId: function () { return state.selectedPinId; },
          getSelectedMarkerId: function () { return state.selectedMarkerId; },
          getShowLabels: function () { return state.showLabels; },
          getMarkers: function () { return state.showPins ? markersHere : []; },
          onSelectPin: function (id) {
            state.selectedPinId = id;
            if (id != null) state.selectedMarkerId = null;
            stage.refreshPins();
            renderPinPanel(panel);
            renderMarkerPanel(mPanel);
          },
          onSelectMarker: function (id) {
            state.selectedMarkerId = id;
            state.selectedPinId = null;
            stage.refreshPins();
            renderPinPanel(panel);
            renderMarkerPanel(mPanel);
          },
          getCompass: function () { return compassFor(state.mapKey); },
          isGm: function () { return gmIsUnlocked(); },
          isItemLocked: function (kind, id) { return isLocked(kind, id); },
          canDragPins: gmIsUnlocked(),
          canDragMarkers: gmIsUnlocked(),
          onMovePin: function (id, x, y) {
            var pin = null;
            DATA.pins.forEach(function (pp) { if (pp.id === id) pin = pp; });
            if (!pin || !sb) return;
            sb.from("map_pins").update({ x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 }, { returning: "minimal" }).eq("id", id).then(function (res) {
              if (res.error) { if (stage) stage.refreshPins(); setMapMsg("That pin could not be moved."); return; }
              pin.x = Math.round(x * 100) / 100; pin.y = Math.round(y * 100) / 100;
              if (stage) stage.refreshPins();
            });
          },
          onContextItem: function (kind, id, cx, cy) { openItemCtx(kind, id, cx, cy); },
          onContextMap: function (x, y, cx, cy) { openMapBgCtx(x, y, cx, cy); },
          onMoveMarker: function (id, x, y) {
            var m = null;
            MARKERS.forEach(function (mm) { if (mm.id === id) m = mm; });
            if (!m || !sb) return;
            var pos = finalizePos(x, y);
            sb.from("map_markers").update({ x: pos.x, y: pos.y, hex_q: pos.q, hex_r: pos.r }, { returning: "minimal" }).eq("id", id).then(function (res) {
              if (res.error) { if (stage) stage.refreshPins(); return; }
              m.x = pos.x; m.y = pos.y; m.hexQ = pos.q; m.hexR = pos.r;
              if (stage) stage.refreshPins();
            });
          },
          onMoveCompass: function (x, y) {
            var c = MAP_EXTRAS.compass[state.mapKey];
            if (!c) return;
            c.x = Math.round(x * 100) / 100; c.y = Math.round(y * 100) / 100;
            saveExtras("compass");
          },
          onDropIcon: gmIsUnlocked() ? function (iconKey, x, y) {
            state.dragIconKey = null;
            state.pendingIconKey = null;
            openLabelDialogForCreate(x, y, "token", iconKey);
          } : null,
          getDragIcon: function () { return state.dragIconKey || null; },
          onMapClick: gmIsUnlocked() ? function (x, y) {
            if (state.pendingIconKey) {
              var armedKey = state.pendingIconKey;
              state.pendingIconKey = null;
              openLabelDialogForCreate(x, y, "token", armedKey);
              return true;
            }
            if (state.mapToolMode) {
              placeToolMarker(x, y);
              return true;
            }
            return false;
          } : null
        });
        renderPinPanel(panel);
        renderMarkerPanel(mPanel);
        if (state.focusPinId != null) {
          var fp = null;
          for (var i = 0; i < pins.length; i++) if (pins[i].id === state.focusPinId) fp = pins[i];
          if (fp) { stage.zoomToPoint(fp.x, fp.y); }
          state.focusPinId = null;
        }
        var chips = main.querySelectorAll("[data-mapchip]");
        for (var a = 0; a < chips.length; a++) chips[a].addEventListener("click", function () { goMap(this.getAttribute("data-mapchip")); });
        var crumbBtns = main.querySelectorAll("[data-crumb]");
        for (var b = 0; b < crumbBtns.length; b++) crumbBtns[b].addEventListener("click", function () { goMap(this.getAttribute("data-crumb")); });
        var back = document.getElementById("crumbBack");
        if (back) back.addEventListener("click", function () {
          var prev = state.mapStack[state.mapStack.length - 1];
          if (prev) { state.mapStack = state.mapStack.slice(0, -1); state.mapKey = prev; state.selectedPinId = null; state.selectedMarkerId = null; render(); window.scrollTo(0, 0); }
        });
        document.getElementById("togglePins").addEventListener("click", function () { state.showPins = !state.showPins; render(); });
        document.getElementById("toggleLabels").addEventListener("click", function () {
          state.showLabels = !state.showLabels;
          this.textContent = state.showLabels ? "Hide labels" : "Show labels";
          this.setAttribute("aria-pressed", String(state.showLabels));
          if (stage) stage.refreshPins();
        });
        var listBtns = main.querySelectorAll("[data-pinlist]");
        for (var d = 0; d < listBtns.length; d++) listBtns[d].addEventListener("click", function () {
          var pid = Number(this.getAttribute("data-pinlist"));
          state.selectedPinId = pid;
          state.selectedMarkerId = null;
          var pin = selectedPin();
          if (stage) stage.refreshPins();
          renderPinPanel(panel);
          renderMarkerPanel(mPanel);
          if (pin && stage) stage.zoomToPoint(pin.x, pin.y);
          document.getElementById("mapFrame").scrollIntoView({ block: "nearest" });
        });

        if (gmIsUnlocked()) { wireMapTools(main); wireIconLibrary(main); }
        decorateSiteText(main);
      }

      render();
      loadLive();
    </script>
  </body>
</html>
