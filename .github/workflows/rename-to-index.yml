name: Rename site file to index.html (one-time)
on:
  push:
    paths:
      - heroes-of-oakrest-2.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename heroes-of-oakrest-2.html to index.html
        run: |
          rm -f index.html
          mv heroes-of-oakrest-2.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename heroes-of-oakrest-2.html to index.html"
          git push
